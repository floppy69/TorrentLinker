name: Synology source integrity

on:
  push:
    branches: [FEAT]
    paths:
      - 'synology/**'
      - '.github/workflows/synology-integrity.yml'
  pull_request:
    paths:
      - 'synology/**'
      - '.github/workflows/synology-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify pristine upstream files
        run: python3 synology/tools/check_upstream_integrity.py --check-worktree
      - name: Run guard tests
        run: python3 -m unittest discover -s synology/tests -v
