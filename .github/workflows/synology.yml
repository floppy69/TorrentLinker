name: Native Synology SPK and upstream sync

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - "synology/**"
      - ".github/workflows/synology.yml"

permissions:
  contents: write

concurrency:
  group: native-synology-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'floppy69/TorrentLinker'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.ref.outputs.sha }}
      build: ${{ steps.ref.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge upstream without overwriting the fork
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Vietnoirien/TorrentLinker.git
          git fetch --no-tags upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git merge --no-edit upstream/main
            # Non-fast-forward failures abort; no force push and no discard of custom files.
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - id: ref
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = schedule ] && \
             [ "${{ steps.sync.outputs.changed }}" != true ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  native:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            platform: manylinux2014_x86_64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            platform: manylinux2014_aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - uses: mamba-org/setup-micromamba@v2
      - name: Build complete native runtime (no Docker)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build wheel
          python -m build --wheel --outdir app-wheels
          uv python install 3.12
          managed="$(uv python find 3.12 --managed-python)"
          mkdir -p runtime wheelhouse
          cp -a "$(dirname "$(dirname "$managed")")/." runtime/
          # pymediainfo's prebuilt Linux wheel needs GLIBC 2.27.
          # Build its pure-Python wrapper instead for DSM's GLIBC 2.26 baseline.
          python -m pip wheel --wheel-dir wheelhouse --no-deps \
            --no-binary=pymediainfo "pymediainfo>=6.1"
          python -m pip download app-wheels/torrentlinker-*.whl \
            --dest wheelhouse \
            --platform "${{ matrix.platform }}" --python-version 312 \
            --implementation cp --abi cp312 --only-binary=:all: \
            --find-links wheelhouse
          python -m pip install --no-index --find-links wheelhouse \
            --target runtime/lib/python3.12/site-packages app-wheels/torrentlinker-*.whl
          # MediaInfo native shared libraries are compiled for both CPU targets.
          # Bundle the conda-forge runtime dependencies, never require them on DSM.
          micromamba create --yes --prefix "$RUNNER_TEMP/tl-media" \
            -c conda-forge "libmediainfo=26.10"
          cp -a "$RUNNER_TEMP/tl-media/lib/." runtime/lib/
          test -e runtime/lib/libmediainfo.so.0
          (
            cd /tmp
            LD_LIBRARY_PATH="$GITHUB_WORKSPACE/runtime/lib" \
            PYTHONPATH="$GITHUB_WORKSPACE/runtime/lib/python3.12/site-packages" \
              "$GITHUB_WORKSPACE/runtime/bin/python3.12" -c \
              "from pymediainfo import MediaInfo; assert MediaInfo.can_parse()"
          )
          # The embedded interpreter must load the installed app, not the checkout.
          (
            cd /tmp
            PYTHONPATH="$GITHUB_WORKSPACE/runtime/lib/python3.12/site-packages" \
              "$GITHUB_WORKSPACE/runtime/bin/python3.12" -c \
              "import torrentlinker.web.server, fastapi, uvicorn, cryptography, numpy, PIL"
          )
      - name: Verify DSM ELF compatibility and pack native SPK
        shell: bash
        run: |
          set -euo pipefail
          python synology/check_binary.py --runtime runtime --arch "${{ matrix.arch }}"
          python -m unittest discover -s synology -p 'test_*.py'
          python synology/build_spk.py --arch "${{ matrix.arch }}" \
            --runtime runtime --run-number "${{ github.run_number }}"
          mkdir -p /tmp/check-spk
          tar xf dist/*.spk -C /tmp/check-spk
          for f in /tmp/check-spk/scripts/*; do sh -n "$f"; done
      - uses: actions/upload-artifact@v4
        with:
          name: native-spk-${{ matrix.arch }}
          path: dist/*.spk
          if-no-files-found: error

  publish:
    needs: [prepare, native]
    # Distribution is opt-in until the upstream copyright/license situation is clarified.
    if: github.event_name != 'pull_request' && vars.SYNOLOGY_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: native-spk-*
          merge-multiple: true
          path: dist
      - name: Publish both native SPKs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*.spk)
          [ "${#files[@]}" -eq 2 ] || exit 1
          version="$(basename "${files[0]}" | sed -E 's/^TorrentLinker-(.*)-(x86_64|aarch64)\.spk$/\1/')"
          gh release create "synology-$version" "${files[@]}" \
            --repo "${{ github.repository }}" --target "$SOURCE_SHA" \
            --title "TorrentLinker Synology native $version" \
            --notes "Native DSM 7.0+ packages: x86_64 and ARMv8. No Docker or separate Python required. Source commit: $SOURCE_SHA. Installation/limitations: synology/README.md" \
            --latest=false
