name: Synology SPK and upstream sync

on:
  schedule:
    # GitHub schedules are approximate; check upstream every six hours.
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - "synology/**"
      - ".github/workflows/synology.yml"

concurrency:
  group: synology-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  synology:
    if: github.repository == 'floppy69/TorrentLinker'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Merge upstream when scheduled or manually requested
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Vietnoirien/TorrentLinker.git
          git fetch --no-tags upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Fork already contains all upstream commits."
          else
            # Conflicts stop the workflow: never overwrite Synology changes.
            git merge --no-edit upstream/main
          fi

      - name: Select revision and skip already-published revisions
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          sha="$(git rev-parse HEAD)"
          echo "image=ghcr.io/floppy69/torrentlinker:sha-${sha:0:12}" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" != "pull_request" ] &&
             [ -n "$(git tag --points-at HEAD --list 'synology-*')" ]; then
            echo "pending=false" >> "$GITHUB_OUTPUT"
            echo "This revision already has a published Synology package."
          else
            echo "pending=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate and build SPK
        if: steps.meta.outputs.pending == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile synology/build_spk.py
          python3 synology/build_spk.py --image "${{ steps.meta.outputs.image }}" \
            --run-number "${{ github.run_number }}"
          mkdir -p /tmp/tl-spk
          tar xf dist/*.spk -C /tmp/tl-spk
          for script in /tmp/tl-spk/scripts/*; do sh -n "$script"; done
          python3 - <<'PY'
          import json, pathlib, tarfile
          p = pathlib.Path("/tmp/tl-spk")
          info = (p / "INFO").read_text()
          assert 'install_dep_packages="ContainerManager>=1432"' in info
          assert json.loads((p / "conf/resource").read_text())["docker-project"]["projects"][0]["path"] == "project"
          with tarfile.open(p / "package.tgz") as t:
              compose = t.extractfile("project/compose.yaml").read().decode()
              assert "TL_WEB_PASSWORD" in compose and "TL_MEDIA_PATH" in compose
          PY

      - name: Build and smoke-test app image
        if: steps.meta.outputs.pending == 'true'
        shell: bash
        run: |
          set -euo pipefail
          docker build -t torrentlinker:smoke .
          docker run -d --name torrentlinker-smoke -p 127.0.0.1:18787:8787 \
            -e TL_WEB_PASSWORD=ci-smoke-test-password torrentlinker:smoke
          trap 'docker logs torrentlinker-smoke || true; docker rm -f torrentlinker-smoke || true' EXIT
          success=0
          for i in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:18787/healthz; then
              success=1
              break
            fi
            sleep 2
          done
          [ "$success" = "1" ] || exit 1

      - name: Upload candidate SPK
        if: steps.meta.outputs.pending == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: synology-spk-${{ github.run_number }}
          path: dist/*.spk
          if-no-files-found: error

      - name: Push merged upstream into fork
        if: steps.meta.outputs.pending == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        shell: bash
        run: |
          # A non-fast-forward error protects concurrent user changes.
          git push origin HEAD:main

      - name: Enable Docker Buildx
        if: steps.meta.outputs.pending == 'true' && github.event_name != 'pull_request'
        uses: docker/setup-buildx-action@v3

      - name: Log into GitHub Container Registry
        if: steps.meta.outputs.pending == 'true' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multiarchitecture image
        if: steps.meta.outputs.pending == 'true' && github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.image }}
          labels: |
            org.opencontainers.image.source=https://github.com/floppy69/TorrentLinker
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish SPK as GitHub Release
        if: steps.meta.outputs.pending == 'true' && github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ steps.meta.outputs.sha }}
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          set -euo pipefail
          file="$(find dist -maxdepth 1 -name '*.spk' -print -quit)"
          [ -n "$file" ]
          version="$(basename "$file" | sed -E 's/^TorrentLinker-(.*)-noarch\.spk$/\1/')"
          tag="synology-$version"
          gh release create "$tag" "$file" \
            --target "$TARGET_SHA" \
            --title "TorrentLinker Synology $version" \
            --notes "DSM 7.2.1+ / Container Manager >= 1432. Source: $TARGET_SHA. Image: $IMAGE. See synology/README.md for installation and upgrades." \
            --latest=false
