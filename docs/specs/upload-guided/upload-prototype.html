margin-top:24px;padding-top:18px;display:flex;justify-content:space-between;gap:10px}.file{padding:12px 0;display:flex;gap:10px;justify-content:space-between;border-bottom:1px solid var(--line)}.check{color:var(--accent)}.track{padding:18px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) 150px auto;gap:15px;align-items:center}.empty{padding:35px;color:var(--muted);text-align:center}.summary{display:flex;gap:8px}.metric{padding:10px 15px;border:1px solid var(--line);border-radius:9px;min-width:115px}.metric b{display:block;font-size:19px}.metric small{font-size:10px}.switcher{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);padding:9px 12px;border-radius:12px;box-shadow:0 8px 35px #0007;font-size:12px;z-index:20}.switcher button{padding:6px 11px}.switcher .on{background:var(--tint);border-color:var(--accent)}dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:13px;padding:24px;width:min(560px,94vw);max-height:88vh;overflow:auto}dialog::backdrop{background:#0009}dialog h2{margin-bottom:8px}dialog p{margin:12px 0}dialog label{display:block;margin:14px 0 5px}dialog input,dialog select{width:100%}.choice{display:block;width:100%;text-align:left;margin:8px 0}.dialogactions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}.toast{position:fixed;bottom:80px;right:25px;background:var(--tint);border:1px solid var(--accent);border-radius:8px;padding:12px 18px;max-width:380px;z-index:25}.palette{display:grid;grid-template-columns:1fr 1fr;gap:10px}.swatch{display:flex;align-items:center;gap:10px;padding:10px;background:var(--bg);border-radius:8px}.swatch i{width:27px;height:27px;border:1px solid var(--line);border-radius:5px}.mobileclose{display:none}.notice{font-size:12px;color:var(--muted);margin:12px 0}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(max-width:1200px){.shell{grid-template-columns:165px minmax(0,1fr)}main{padding:22px 22px 100px}.workspace{grid-template-columns:minmax(0,1fr) 340px}.steps{gap:5px}.step{padding:10px 9px}.summary{display:none}}@media(max-width:1000px){.workspace{grid-template-columns:1fr}.inspector{display:none}.inspector.open{display:block;position:fixed;top:0;right:0;bottom:75px;width:min(390px,100vw);z-index:15;overflow:auto;border-radius:0;box-shadow:-20px 0 70px #0009}.mobileclose{display:block}.steps{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.sidebar{display:none}.shell{display:block}main{padding:18px 14px 120px}.top .client{display:none}.intro{align-items:flex-start}.intro h2{font-size:21px}.item{grid-template-columns:28px minmax(0,1fr) 100px;padding:13px 12px;gap:9px}.switcher{width:calc(100% - 16px);flex-wrap:wrap;justify-content:center;bottom:8px}.switcher>span{display:none}.columns{grid-template-columns:1fr}.track{grid-template-columns:1fr}.step small{font-size:10px}.tabs{gap:20px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<!-- Throwaway preview. One approved design family, desktop/Web parity. In-memory simulation only. -->
<div class="shell"><aside class="sidebar"><div class="brand"><span class="logo">ŦL</span>TorrentLinker</div><button data-nav="Zen"><span class="icon">◈</span>Zen</button><button data-nav="Bibliothèque"><span class="icon">▤</span>Bibliothèque</button><button class="on" data-nav="Upload"><span class="icon">↑</span>Upload</button><button data-nav="Recherche"><span class="icon">⌕</span>Recherche</button><button data-nav="RSS"><span class="icon">◔</span>RSS</button><button data-nav="Torrents"><span class="icon">⇅</span>Torrents</button><button data-nav="Assistant"><span class="icon">◇</span>Assistant</button><button data-nav="Médias"><span class="icon">▷</span>Médias</button><div class="bottom"></div><button data-action="palette">◐　Apparence commune</button><button data-nav="Documentation">Documentation</button><button data-action="settings">Paramètres</button><small id="shell-mode">Application de bureau</small></aside>
<main><header class="top row between"><div><h1>Upload</h1><small>De vos fichiers à un partage prêt à être publié.</small></div><div class="client"><label for="client">Client cible</label><select id="client"><option>qBittorrent · Cet ordinateur</option><option>Transmission · NAS</option></select><button data-action="settings">Clients…</button></div></header><nav class="tabs" aria-label="Espaces Upload"><button class="on" data-tab="sources">Sources <span class="count" id="sources-count"></span></button><button data-tab="drafts">Brouillons <span class="count" id="drafts-count"></span></button><button data-tab="tracking">Suivi <span class="count" id="tracking-count"></span></button></nav><div id="content"></div></main></div>
<div class="switcher"><span>Aperçu interactif · données fictives</span><button data-mode="desktop">Desktop</button><button data-mode="web">Web UI</button><button data-action="demo" id="demo-button">▶ Animer le parcours</button><button data-action="reset">Réinitialiser</button></div><dialog id="dialog"><div id="dialog-content"></div></dialog><div id="toast" class="toast" role="status" hidden></div>
<script>
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stages=['Sources','Vérifier l’existant','Préparer','Présentation','Révision','Envoyer & suivre'];
let mode=new URL(location).searchParams.get('mode')||'desktop',tab='sources',filter='all',query='',selected=1,step=0,drawer=false,animating=false,items=[],nextId=10;
function reset(){items=[
{id:1,name:'Les Sentiers du Nord (2024)',kind:'Film',size:'8,4 Go',reason:'none',path:'/Médias/Films/Les Sentiers du Nord.mkv',stage:0,draft:false,status:'À examiner',events:['Recherche terminée · aucun candidat trouvé'],description:'',revision:1},
{id:2,name:'Atlas des jardins oubliés',kind:'Livre',size:'146 Mo',reason:'rejected',path:'/Médias/Livres/Atlas des jardins oubliés.epub',stage:0,draft:false,status:'À examiner',events:['3 candidats examinés · formats ou contenu incompatibles'],description:'',revision:1},
{id:3,name:'Acoustic Sessions · Volume II',kind:'Audio',size:'1,2 Go',reason:'unchecked',path:'/Médias/Musique/Acoustic Sessions',stage:0,draft:false,status:'Recherche à terminer',events:['Recherche interrompue · présence sur le site inconnue'],description:'',revision:1},
{id:4,name:'Phare côtier · modèle 3D',kind:'Modèle 3D',size:'384 Mo',reason:'manual',path:'/Créations/Phare côtier',stage:3,draft:true,status:'À compléter',events:['Ajout manuel · dossier','Noms et fichiers préparés','Présentation à compléter'],description:'Modèle de phare côtier. Fichiers STL inclus, avec une version creuse et une version pleine.',revision:2},
{id:5,name:'Carnets de montagne',kind:'Livre',size:'82 Mo',reason:'none',path:'/Médias/Livres/Carnets de montagne.epub',stage:4,draft:true,status:'Prêt à relire',events:['Recherche terminée · aucun équivalent retenu','Métadonnées et présentation enregistrées'],description:'Carnets illustrés de randonnées. Format EPUB, texte en français.',revision:1},
{id:6,name:'Nocturnes · enregistrements live',kind:'Audio',size:'960 Mo',reason:'manual',path:'/Médias/Musique/Nocturnes',stage:5,draft:true,sent:true,status:'Brouillon c411',events:['Révision 3 confirmée','Brouillon transmis à c411 · publication manuelle attendue'],description:'Enregistrements live.',revision:3}];tab='sources';selected=1;step=0;filter='all';query='';animating=false;drawer=false;render()}
const reasons={none:['Aucun candidat trouvé','ok'],rejected:['Candidats incompatibles','blue'],unchecked:['Recherche incomplète','warn'],manual:['Ajout manuel','']};
const current=()=>items.find(i=>i.id===selected);
function visible(){return items.filter(i=>(tab==='sources'?!i.draft:tab==='drafts'?i.draft&&!i.sent:i.sent)&&(!query||i.name.toLowerCase().includes(query.toLowerCase()))&&(filter==='all'||i.reason===filter))}
function toast(s){$('toast').textContent=s;$('toast').hidden=false;setTimeout(()=>$('toast').hidden=true,4200)}
function dialog(html){$('dialog-content').innerHTML=html+`<div class="dialogactions"><button data-action="close">Fermer</button></div>`;if(!$('dialog').open)$('dialog').showModal()}
function event(i,s){i.events.push(s)}
function render(){document.body.dataset.mode=mode;$('shell-mode').textContent=mode==='desktop'?'Application de bureau':'Web UI · serveur personnel';document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('on',b.dataset.mode===mode));document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));$('sources-count').textContent=items.filter(i=>!i.draft).length;$('drafts-count').textContent=items.filter(i=>i.draft&&!i.sent).length;$('tracking-count').textContent=items.filter(i=>i.sent).length;$('demo-button').textContent=animating?'Ⅱ Suspendre l’animation':'▶ Animer le parcours';const i=current(),rows=visible();
$('content').innerHTML=`<div class="intro row between"><div><h2>${tab==='sources'?'Un nouveau partage commence ici.':tab==='drafts'?'Chaque brouillon avance à son rythme.':'Gardez le fil de vos partages.'}</h2><p class="muted">${tab==='sources'?'Les recherches de votre bibliothèque suggèrent des fichiers à examiner.':tab==='drafts'?'Préparez, complétez et relisez. Vos autres brouillons continuent d’avancer.':'Retrouvez les envois, les corrections attendues et leur historique.'}</p></div><div class="actions"><button data-action="file">+ Choisir un fichier</button><button class="primary" data-action="folder">+ Choisir un dossier</button></div></div>
<div class="steps" aria-label="Parcours de l’élément sélectionné">${stages.map((name,n)=>`<button class="step ${step===n?'on':''} ${i&&i.stage>n?'done':''}" data-step="${n}"><b><span class="num">${i&&i.stage>n?'✓':String(n+1).padStart(2,'0')}</span>${name}</b><small>${['Bibliothèque ou ajout manuel','Rechercher les équivalents','Fichiers et informations','Description, NFO et images','Relire la version enregistrée','Brouillon c411 et publication'][n]}</small></button>`).join('')}</div>
<div class="running"><span><i class="dot ${animating?'pulse':''}"></i>${animating?'Préparation en cours':'Vous gardez la main sur chaque envoi'}</span><span>${items.filter(i=>i.busy).length} opérations en cours · ${items.filter(i=>i.draft&&!i.sent).length} brouillons locaux</span><span>Envoi uniquement après votre confirmation</span></div>
${tab==='tracking'?tracking():`<div class="workspace">${tab==='drafts'&&step>0?editor(i):list(rows)}${inspector(i)}</div>`}`;
}
function list(rows){return `<section class="panel"><div class="tools"><label class="sr" for="search">Rechercher</label><input class="search" id="search" placeholder="Rechercher dans ${tab==='sources'?'mes sources':'mes brouillons'}…" value="${esc(query)}"><div class="chips">${[['all','Tous'],['none','Sans candidat'],['rejected','Candidats écartés'],['manual','Ajouts manuels'],['unchecked','À vérifier']].map(([k,label])=>`<button class="chip ${filter===k?'on':''}" data-filter="${k}">${label}</button>`).join('')}</div></div><div class="listhead"><span>${tab==='sources'?'Sources proposées':'Brouillons locaux'}</span><span>${tab==='sources'?'Origine de la suggestion':'Étape actuelle'}</span></div>${rows.map(i=>`<div class="item ${i.id===selected?'selected':''}" role="button" tabindex="0" data-item="${i.id}"><div class="cover">${{'Film':'VID','Livre':'EPUB','Audio':'FLAC','Modèle 3D':'STL'}[i.kind]||'FILE'}</div><div><strong>${esc(i.name)}</strong><small>${esc(i.kind)} · ${i.size}</small><small>${esc(i.events[0])}</small>${i.busy?`<div class="progress"><i style="width:${i.progress||15}%"></i></div>`:''}</div><div><span class="badge ${reasons[i.reason][1]}">${i.busy?'Analyse en cours':tab==='sources'?reasons[i.reason][0]:i.status}</span></div></div>`).join('')||'<div class="empty">Aucun élément pour ce filtre.</div>'}<div class="foot">${rows.length} élément(s) · Un candidat incompatible ne prouve pas l’absence du contenu sur c411.</div></section>`}
function inspector(i){if(!i)return '';return `<aside class="panel inspector ${drawer?'open':''}"><button class="mobileclose" data-action="drawer-close">Fermer l’inspecteur</button><div class="eyebrow">${i.draft?'LE BROUILLON SÉLECTIONNÉ':'LA SOURCE SÉLECTIONNÉE'}</div><div class="detailtitle"><span class="badge ${reasons[i.reason][1]}">${i.status}</span><h2>${esc(i.name)}</h2><small>${i.kind} · ${i.size}</small></div><div class="callout"><b>${i.reason==='rejected'?'Pourquoi cette suggestion ?':i.reason==='unchecked'?'Recherche encore nécessaire':'Avant de préparer l’upload'}</b><p class="muted">${i.reason==='rejected'?'Les candidats examinés ne correspondent pas à vos fichiers. Vérifiez les autres éditions ou releases avant de créer le brouillon.':i.reason==='unchecked'?'La recherche a été interrompue. Cet élément n’est pas considéré comme absent du site.':'L’absence de résultat est une piste. Confirmez le contenu et vérifiez les éventuels doublons.'}</p>${!i.draft?'<button class="primary" data-action="prepare">Examiner cette source →</button>':`<button data-action="edit">${i.sent?'Voir le suivi':'Ouvrir le brouillon →'}</button>`}</div><div class="section"><div class="eyebrow">FICHIERS D’ORIGINE</div><p style="overflow-wrap:anywhere;margin-top:8px;font-size:12px">${esc(i.path)}</p><small>Les fichiers restent à leur emplacement.</small></div><div class="section"><div class="row between"><b>Son parcours</b><small>${i.draft?'Révision '+i.revision:'Pas encore de brouillon'}</small></div><div class="timeline">${i.events.slice(-5).map((s,n)=>`<p><small>${String(9+n).padStart(2,'0')}:42 · Aujourd’hui</small>${esc(s)}</p>`).join('')}</div></div></aside>`}
function editor(i){if(!i||!i.draft)return list(visible());let body='';if(step===1)body=`<div class="callout"><b>${i.reason==='unchecked'?'Recherche à reprendre':'Résultats de la bibliothèque disponibles'}</b><p class="muted">Recherche par titre, contenu, format et taille. Écarter une release ne suffit pas à exclure toutes les autres.</p><button data-action="search-site">${i.busy?'Recherche en cours…':'Relancer la recherche simulée'}</button></div><div class="file"><div><strong>${i.reason==='rejected'?'3 candidats écartés':'Aucun équivalent retenu'}</strong><p class="muted">${i.reason==='rejected'?'Deux PDF et une édition abrégée, différents de cet EPUB.':'Les résultats consultés restent disponibles dans l’historique.'}</p></div><span class="badge blue">À confirmer</span></div><label><input type="checkbox" id="confirm-existing" ${i.existing?'checked':''}> J’ai examiné les résultats et retenu cette source.</label>`;
if(step===2)body=`<label for="release-name">Nom de la release</label><input id="release-name" value="${esc(i.name)}"><div class="columns"><div><label for="category">Catégorie</label><select id="category">${['Film','Livre','Audio','Modèle 3D','Autre'].map(k=>`<option ${k===i.kind?'selected':''}>${k}</option>`).join('')}</select></div><div><label for="language">Langue du contenu</label><select id="language"><option>Français</option><option>Multilingue</option><option>Sans objet</option></select></div></div><div class="section"><b>Contenu sélectionné</b><div class="file"><span>☑ ${esc(i.path.split('/').pop())}</span><small>${i.size}</small></div><div class="file"><span class="muted">Fichiers temporaires et cachés</span><small>Exclus</small></div><p class="notice">${i.kind==='Modèle 3D'?'La préparation 3D et les rendus restent disponibles.':'Les informations techniques seront extraites des fichiers.'}</p><button data-action="technical">Voir les informations techniques</button></div>`;
if(step===3)body=`<label for="description">Description du partage</label><textarea id="description" placeholder="Présentez le contenu, la version et les informations utiles…">${esc(i.description)}</textarea><div class="row" style="margin-top:12px"><button data-action="template">Insérer un modèle</button><button data-action="nfo">Voir le NFO</button></div><div class="section"><div class="row between"><b>Illustrations et captures</b><button data-action="artwork">+ Ajouter une image</button></div><div class="callout"><span class="badge ${i.artwork?'ok':''}">${i.artwork?'1 image ajoutée':'Aucune image ajoutée'}</span><p class="muted">Affiche, couverture ou rendu selon la catégorie. Le choix de l’hébergement sera visible ici.</p></div></div>`;
if(step===4)body=`<div class="callout"><b>${i.description?'Votre brouillon est prêt à être relu.':'Complétez la présentation avant de poursuivre.'}</b><p class="muted">Cette révision regroupe les fichiers, les informations et la description ci-dessous.</p></div><div class="file"><span>Fichiers et catégorie</span><span class="check">✓ Vérifiés</span></div><div class="file"><span>Description</span><span class="${i.description?'check':'muted'}">${i.description?'✓ Renseignée':'À compléter'}</span></div><div class="file"><span>Version enregistrée</span><b>Révision ${i.revision}</b></div><div class="section"><h3>${esc(i.name)}</h3><p style="margin-top:12px">${esc(i.description)||'La description apparaîtra ici.'}</p><label><input type="checkbox" id="reviewed" ${i.reviewed?'checked':''} ${i.description?'':'disabled'}> J’ai relu cette version et son contenu.</label><p class="notice">Toute modification annule cette validation et demande une nouvelle relecture.</p></div>`;
if(step===5)body=`<div class="callout"><b>${i.sent?'Brouillon c411 créé':'Prêt pour l’envoi du brouillon ?'}</b><p class="muted">${i.sent?'Retrouvez la fiche distante dans Suivi. La publication finale se fait sur c411.':'Le brouillon local est conservé. La création du brouillon c411 demande une confirmation explicite.'}</p></div><div class="file"><span>Source</span><b>${esc(i.name)}</b></div><div class="file"><span>Révision</span><b>${i.revision}</b></div><div class="file"><span>Relecture</span><span class="badge ${i.reviewed?'ok':'warn'}">${i.reviewed?'Confirmée':'À effectuer'}</span></div><p class="notice">Aucun envoi automatique, même si les autres préparations avancent.</p><button class="primary" data-action="send" ${!i.reviewed||i.sent?'disabled':''}>Créer le brouillon c411…</button>`;
return `<section class="panel editor"><div class="row between"><div><div class="eyebrow">${String(step+1).padStart(2,'0')} · ${stages[step].toUpperCase()}</div><h2>${esc(i.name)}</h2></div><button data-action="draft-list">Voir la liste</button></div>${body}<div class="bottomactions"><button data-action="previous">← Précédente</button><div class="row"><button data-action="save">Enregistrer</button>${step<5?'<button class="primary" data-action="next">Enregistrer et continuer →</button>':''}</div></div></section>`}
function tracking(){const rows=items.filter(i=>i.sent);return `<section class="panel"><div class="tools row between"><div><h3>Envois et publication</h3><small>La préparation locale, le brouillon c411 et la publication sont des étapes distinctes.</small></div><button data-action="refresh-tracking">Actualiser</button></div>${rows.map(i=>`<div class="track"><div><strong>${esc(i.name)}</strong><small style="display:block">Révision ${i.revision} · ${i.kind} · ${i.size}</small></div><span class="badge ${i.status==='Correction demandée'?'warn':'ok'}">${i.status}</span><button data-history="${i.id}">Voir le détail →</button></div>`).join('')||'<div class="empty">Vos envois apparaîtront ici.</div>'}<div class="foot">Un problème d’envoi reste visible. Aucun nouvel envoi n’est tenté sans votre accord.</div></section>`}
function save(){const i=current();if(!i)return;if(step===1){i.existing=!!$('confirm-existing')?.checked;if(!i.existing){toast('Examinez les résultats puis confirmez cette source.');return false}}let changed=false;if($('release-name')){changed=i.name!==$('release-name').value||i.kind!==$('category').value;i.name=$('release-name').value;i.kind=$('category').value}if($('description')){changed=i.description!==$('description').value;i.description=$('description').value}if(changed){i.revision++;i.reviewed=false;event(i,'Modifications enregistrées · nouvelle révision '+i.revision)}if(step===4)i.reviewed=!!$('reviewed')?.checked;i.status=i.reviewed?'Révision confirmée':i.description?'Prêt à relire':'À compléter';return true}
function manual(type){dialog(`<div class="eyebrow">AJOUT MANUEL · ${mode==='desktop'?'CET ORDINATEUR':'SERVEUR TORRENTLINKER'}</div><h2>Choisir ${type==='file'?'un fichier':'un dossier'}</h2><p class="muted">${mode==='desktop'?'Dans l’application, Parcourir ouvrira le sélecteur natif.':'Dans la Web UI, vous parcourez les fichiers accessibles au serveur, pas ceux de cet ordinateur.'}</p><form id="manual-form"><label for="manual-path">Chemin ${type==='file'?'du fichier':'du dossier'}</label><div class="row"><input id="manual-path" required value="${type==='file'?'/Médias/Livres/Herbier des saisons.epub':'/Créations/Ma collection'}"><button type="button" data-picker="${type}">Parcourir…</button></div><label for="manual-kind">Type de contenu</label><select id="manual-kind"><option>Livre</option><option>Film</option><option>Audio</option><option>Modèle 3D</option><option>Autre</option></select><p class="notice">Sélection simulée dans cet aperçu. Aucun fichier n’est lu ou envoyé.</p><button class="primary" type="submit">Ajouter aux sources</button></form>`)}
document.addEventListener('click',e=>{const b=e.target.closest('button'),row=e.target.closest('[data-item]');if(b?.dataset.mode){mode=b.dataset.mode;history.replaceState(null,'','?mode='+mode);render();return}if(b?.dataset.tab){tab=b.dataset.tab;step=0;filter='all';query='';const first=visible()[0];if(first)selected=first.id;drawer=false;render();return}if(b&&'filter'in b.dataset){filter=b.dataset.filter;render();return}if(row){selected=+row.dataset.item;drawer=true;render();return}if(b&&'step'in b.dataset){const n=+b.dataset.step;if(!current()?.draft&&n>0){toast('Choisissez une source puis « Examiner cette source ».');return}step=n;render();return}if(b?.dataset.nav){if(b.dataset.nav!=='Upload')toast('Cet aperçu présente Upload. La palette de la navigation est commune à toute l’application.');return}if(b?.dataset.picker){dialog(`<h2>${mode==='desktop'?'Sélection de fichier simulée':'Parcourir le serveur'}</h2><p class="muted">${mode==='desktop'?'Exemples de sélection, sans accès à votre disque.':'/Médias · emplacements accessibles au serveur'}</p>${['/Médias/Livres/Herbier des saisons.epub','/Médias/Films/Les Horizons.mkv','/Créations/Collection de maquettes'].map(p=>`<button class="choice" data-picked="${esc(p)}">${esc(p)}</button>`).join('')}`);return}if(b?.dataset.picked){const p=b.dataset.picked;manual(p.endsWith('.epub')||p.endsWith('.mkv')?'file':'folder');$('manual-path').value=p;return}if(b?.dataset.history){const i=items.find(i=>i.id===+b.dataset.history);dialog(`<h2>${esc(i.name)}</h2><span class="badge ok">${i.status}</span><div class="timeline">${i.events.map(s=>`<p>${esc(s)}</p>`).join('')}</div><p class="muted">Ouvrir sur c411 permettra de relire et publier la fiche distante.</p><button data-action="simulate-correction" data-id="${i.id}">Simuler une demande de correction</button>`);return}const a=b?.dataset.action,i=current();if(!a)return;switch(a){case'close':$('dialog').close();return;case'drawer-close':drawer=false;break;case'file':manual('file');return;case'folder':manual('folder');return;case'reset':reset();return;case'demo':animating=!animating;if(animating){items.filter(x=>!x.draft).forEach(x=>{x.busy=true;x.progress=5});toast('Recherches et analyses simulées en parallèle. Aucun envoi ne sera déclenché.')}break;case'prepare':i.draft=true;i.stage=1;event(i,'Brouillon local créé · vérification de l’existant');tab='drafts';step=1;drawer=false;break;case'edit':tab=i.sent?'tracking':'drafts';step=i.stage||1;drawer=false;break;case'draft-list':step=0;break;case'previous':step=Math.max(0,step-1);break;case'save':if(save())toast('Brouillon enregistré localement · simulation');break;case'next':if(!save())return;if(step===4&&!i.reviewed){toast('Relisez et confirmez cette révision avant l’envoi.');return}step=Math.min(5,step+1);i.stage=Math.max(i.stage,step);break;case'search-site':i.busy=true;i.progress=5;animating=true;event(i,'Nouvelle recherche démarrée');break;case'template':$('description').value=`${i.name}\n\nPrésentation du contenu, format, langue et informations utiles.`;return;case'nfo':dialog(`<h2>NFO · aperçu</h2><pre style="white-space:pre-wrap">${esc(i.name)}\nTYPE : ${i.kind}\nTAILLE : ${i.size}\nSOURCE : fichiers sélectionnés</pre><p class="notice">Les outils NFO existants restent accessibles depuis cette étape.</p>`);return;case'technical':dialog(`<h2>Informations techniques</h2><p>${i.kind} · ${i.size}</p><p class="muted">Format, contenu, pistes et métadonnées adaptés à la catégorie. Données fictives pour cet aperçu.</p>`);return;case'artwork':i.artwork=true;event(i,'Illustration ajoutée · exemple');toast('Image fictive ajoutée. Aucun hébergement réel.');break;case'send':dialog(`<h2>Créer ce brouillon sur c411 ?</h2><p><b>${esc(i.name)}</b><br>Révision ${i.revision} · ${i.size}</p><p>Les fichiers, la présentation et le NFO relus sont ceux de cette version. La publication finale restera manuelle sur c411.</p><p class="notice">Cet aperçu simule la création, sans contacter c411.</p><button class="primary" data-action="confirm-send">Confirmer l’envoi simulé</button>`);return;case'confirm-send':i.sent=true;i.status='Brouillon c411';i.stage=5;event(i,'Révision '+i.revision+' envoyée · simulation');event(i,'Publication manuelle attendue sur c411');$('dialog').close();tab='tracking';break;case'simulate-correction':{const x=items.find(x=>x.id===+b.dataset.id);x.status='Correction demandée';event(x,'Correction demandée : compléter la description');$('dialog').close();break}case'refresh-tracking':toast('Suivi à jour · données de démonstration');break;case'palette':dialog(`<h2>Une seule palette pour toute l’application</h2><p class="muted">Même fond, mêmes panneaux, mêmes boutons. Le bureau et la Web UI utilisent les mêmes valeurs, y compris la navigation.</p><div class="palette">${[['Fond','#161d23'],['Panneaux & sidebar','#202932'],['Surfaces relevées','#26323c'],['Bordures','#33404b'],['Accent','#80bdb6'],['Sélection','#263e43']].map(([n,c])=>`<div class="swatch"><i style="background:${c}"></i><span>${n}<br><small>${c}</small></span></div>`).join('')}</div>`);return;case'settings':dialog('<h2>Réglages Upload</h2><p>Client cible, URL d’annonce et accès à c411.</p><div class="callout"><b>Préparer reste possible hors connexion.</b><p class="muted">Les prérequis de connexion seront vérifiés au moment de l’envoi.</p></div><p class="notice">La configuration réelle reste inchangée dans cet aperçu.</p>');return}render()});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;const pos=e.target.selectionStart;render();$('search').focus();$('search').setSelectionRange(pos,pos)}});
document.addEventListener('submit',e=>{if(e.target.id!=='manual-form')return;e.preventDefault();const path=$('manual-path').value;const i={id:nextId++,name:path.split('/').filter(Boolean).pop(),kind:$('manual-kind').value,size:'À analyser',path,reason:'manual',stage:0,status:'À vérifier',draft:false,events:['Ajout manuel · recherche de doublons nécessaire'],description:'',revision:1};items.unshift(i);selected=i.id;tab='sources';step=0;filter='all';query='';$('dialog').close();render();toast('Source ajoutée. Vous pouvez maintenant l’examiner.')});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-item]')){e.preventDefault();selected=+e.target.dataset.item;drawer=true;render()}});
setInterval(()=>{if(!animating)return;let changed=false;items.forEach((i,n)=>{if(!i.busy)return;i.progress=Math.min(100,i.progress+9+n*4);if(i.progress===100){i.busy=false;i.reason=i.reason==='unchecked'?'none':i.reason;i.status=i.draft?'Résultats disponibles':'À examiner';event(i,'Analyse terminée · résultats à examiner')}changed=true});if(!items.some(i=>i.busy))animating=false;if(changed&&!document.activeElement?.matches('input,textarea,select')&&!$('dialog').open)render()},950);
reset();
</script></body></html>
