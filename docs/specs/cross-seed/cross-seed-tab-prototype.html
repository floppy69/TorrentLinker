<div id="switcher"><button id="prev" aria-label="Variante précédente">←</button><b id="label"></b><button id="next" aria-label="Variante suivante">→</button>
 <button id="complete">Simuler un téléchargement terminé</button><button id="pause">Tout suspendre</button><button id="theme">Thème</button></div>
<script>
/* Fictional Indexers and torrents. pace: what the Indexer's own limits allow right now. */
const INDEXERS=[
 {id:"c411",name:"c411",pace:"budget 12/20 cette heure · Catalogue d'abord",on:true},
 {id:"nebula",name:"Nebula",pace:"libre",on:true},
 {id:"orion",name:"Orion",pace:"limité par l'indexeur · reprise dans 40 s",on:true},
 {id:"vega",name:"Vega",pace:"libre",on:true},
];
const STATES={searching:["Recherche","blue"],queued:["En attente","" ],added:["Ajouté","ok"],verifying:["Vérification","blue"],review:["À vérifier","warn"],failed:["Échec","bad"],orphan:["Données disparues","bad"]};
const THRESHOLD=95;
let items=[
 {id:1,name:"Dune.Part.Two.2024.MULTi.1080p.WEB.x264",from:"c411",to:"nebula",state:"added",cov:100,kind:"Full",size:"7,1 Go",when:"il y a 3 min",why:"Correspondance complète, vérifiée à 100 %."},
 {id:2,name:"Dune.Part.Two.2024.MULTi.1080p.WEB.x264",from:"c411",to:"vega",state:"added",cov:97,kind:"Partial",size:"7,1 Go",when:"il y a 3 min",why:"97 % présents : NFO et sample ignorés, jamais téléchargés.",missing:["Dune.sample.mkv · 48 Mo","Dune.nfo · 4 Ko"]},
 {id:3,name:"The.Bear.S03.FRENCH.1080p.WEB",from:"nebula",to:"c411",state:"review",cov:88,kind:"Partial",size:"14,6 Go",when:"il y a 12 min",why:"88 % présents, sous le seuil de 95 % : 2 épisodes manquent.",missing:["S03E09 · 1,4 Go","S03E10 · 1,6 Go"]},
 {id:4,name:"Le.Comte.de.Monte-Cristo.2024.FRENCH.2160p",from:"bibliothèque",to:"c411",state:"review",cov:100,kind:"Archive",size:"21,8 Go",when:"il y a 20 min",why:"Les fichiers sont dans une archive .rar : la décompresser d'abord."},
 {id:5,name:"Oppenheimer.2023.MULTi.2160p.HDR",from:"c411",to:"orion",state:"queued",cov:0,kind:"",size:"31,2 Go",when:"en attente",why:"Orion limite les recherches ; reprise dans 40 s."},
 {id:6,name:"Anora.2024.VOSTFR.1080p",from:"c411",to:"nebula",state:"failed",cov:100,kind:"Full",size:"5,4 Go",when:"il y a 1 h",why:"Vérification à 92 % : les fichiers diffèrent. Torrent retiré, données intactes. Il ne sera plus proposé, sauf si vous réessayez."},
 {id:7,name:"Sirat.2025.FRENCH.1080p",from:"orion",to:"c411",state:"verifying",cov:100,kind:"Full",size:"6,0 Go",when:"en cours",why:"Ajouté arrêté, vérification par le client."},
 {id:8,name:"Vice-Versa.2.2024.MULTi.1080p",from:"c411",to:"vega",state:"orphan",cov:100,kind:"Full",size:"4,3 Go",when:"il y a 2 j",why:"Le torrent d'origine a été supprimé avec ses fichiers ; ce cross-seed n'a plus de données."},
];
let variant=new URLSearchParams(location.search).get("variant")||"A",filter="all",selected=3,idxFilter="all",paused=false,next=100;
const variants=[["A","Flux"],["B","Par indexeur"],["C","Revue d'abord"]];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
const idx=id=>id==="bibliothèque"?"Bibliothèque":(INDEXERS.find(i=>i.id===id)||{name:id}).name;
const count=s=>items.filter(i=>s==="all"||i.state===s).length;
const badge=i=>`<span class="badge ${STATES[i.state][1]}">${STATES[i.state][0]}</span>`;
const route=i=>`<small>${esc(idx(i.from))} → <b>${esc(idx(i.to))}</b> · ${i.size}${i.kind?` · ${i.kind==="Full"?"complète":i.kind==="Partial"?i.cov+" %":"archive"}`:""}</small>`;
const coverage=i=>i.kind?`<div class="coverage" title="Seuil ${THRESHOLD} %"><i style="width:${i.cov}%"></i><b style="left:${THRESHOLD}%"></b></div><small>${i.cov} % présents · seuil d'ajout automatique ${THRESHOLD} %</small>`:"";
const decide=i=>i.state==="review"?(i.kind==="Archive"?`<button class="primary" data-accept="${i.id}">Décompresser et remettre en seed</button><button data-reject="${i.id}">Écarter</button>`:`<button class="primary" data-accept="${i.id}">Ajouter sans les fichiers manquants</button><button data-reject="${i.id}">Écarter</button>`)
 :i.state==="failed"?`<button data-retry="${i.id}">Réessayer</button>`:i.state==="orphan"?`<button data-remove="${i.id}">Retirer du client (garder les données)</button>`:"";

function running(){const busy=items.filter(i=>["searching","verifying"].includes(i.state)).length;
 return `<div class="running"><span><i class="dot" style="animation-play-state:${paused?"paused":"running"}"></i>${paused?"Cross-seed suspendu":"Cross-seed actif"}</span><small>${busy} en cours · ${count("review")} à vérifier · ajout automatique : complètes et partielles ≥ ${THRESHOLD} %</small><small style="margin-left:auto">${INDEXERS.length} indexeurs · tag « cross-seed »</small></div>`}
function row(i){return `<div class="torrent ${selected===i.id?"selected":""}" data-item="${i.id}" role="button" tabindex="0"><input type="checkbox" aria-label="Sélectionner ${esc(i.name)}"><div class="cover">${esc(idx(i.to)).slice(0,2).toUpperCase()}</div><div><div class="title">${esc(i.name)}</div>${route(i)}</div><div>${badge(i)}${["searching","verifying"].includes(i.state)?`<div class="progress"><i style="width:${i.state==="verifying"?62:30}%"></i></div>`:""}<small style="display:block;text-align:right">${i.when}</small></div></div>`}
function inspector(){const i=items.find(x=>x.id===selected)||items[0];
 return `<aside class="panel inspector"><div class="eyebrow">LE CROSS-SEED SÉLECTIONNÉ</div><div class="detail-head"><h2>${esc(i.name)}</h2>${route(i)}</div>${badge(i)}
 <div class="callout"><b>${i.state==="review"?"Votre décision":i.state==="added"?"Ajouté automatiquement":STATES[i.state][0]}</b><p class="muted">${esc(i.why)}</p>${coverage(i)}${i.missing?`<div class="files">${i.missing.map(m=>`<div class="miss"><span>${esc(m)}</span><span>absent · ignoré</span></div>`).join("")}</div>`:""}${decide(i)}</div>
 <div class="section"><b>Dans le client</b><p class="muted" style="margin-top:6px">Tags « cross-seed » et « ${esc(idx(i.to))} » · même catégorie et même dossier que l'original · disposition : renommage dans le torrent.</p></div>
 <div class="section"><b>Son parcours</b><ol class="steps">${["Recherché sur "+idx(i.to),"Correspondance "+({Full:"complète",Partial:"partielle",Archive:"dans une archive"}[i.kind]||"…"),"Ajouté arrêté","Vérifié à 100 %","En partage"].map((n,k)=>{const at={queued:0,searching:0,review:1,failed:3,verifying:3,added:4,orphan:4}[i.state];return `<li class="${k===at?"current":""}">${k<at?"✓":k===at?"●":"○"}　${esc(n)}</li>`}).join("")}</ol></div></aside>`}

/* A · Flux: counters by state, one list of every cross-seed, the inspector. */
function A(){const list=items.filter(i=>filter==="all"||i.state===filter);
 return running()+`<div class="stages">${[["all","Tous"],["review","À vérifier"],["added","Ajoutés"],["queued","En attente"],["failed","Échecs"],["orphan","Données disparues"]].map(([s,l])=>`<button class="stage ${filter===s?"on":""}" data-filter="${s}"><b>${count(s)}</b>${l}</button>`).join("")}</div>
 <div class="workspace"><section class="panel"><div class="tools"><input placeholder="Rechercher un torrent…" aria-label="Rechercher"></div>${list.map(row).join("")||`<div class="empty">Rien dans cet état.</div>`}<div class="foot">${list.length} affichés · ${count("added")} en partage grâce au cross-seed</div></section>${inspector()}</div>`}

/* B · Par indexeur: one tile per Indexer with its pace, then that Indexer's cross-seeds. */
function B(){const list=items.filter(i=>idxFilter==="all"||i.to===idxFilter||i.from===idxFilter);
 return running()+`<div class="stages idx-tiles"><button class="stage ${idxFilter==="all"?"on":""}" data-idx="all"><b>${items.length}</b>Tous les indexeurs<small>${count("review")} à vérifier</small></button>${INDEXERS.map(x=>`<button class="stage ${idxFilter===x.id?"on":""}" data-idx="${x.id}"><b>${items.filter(i=>i.to===x.id).length}</b>${esc(x.name)}<small>${esc(x.pace)}</small></button>`).join("")}</div>
 <div class="workspace"><section class="panel"><div class="tools"><input placeholder="Rechercher un torrent…" aria-label="Rechercher"><select aria-label="État"><option>Tous les états</option><option>À vérifier</option><option>Ajoutés</option><option>Échecs</option></select></div>${list.map(row).join("")}<div class="foot">${list.length} affichés</div></section>${inspector()}</div>`}

/* C · Revue d'abord: what needs you as cards, the rest as a short feed. */
function C(){const need=items.filter(i=>["review","failed","orphan"].includes(i.state)),rest=items.filter(i=>!need.includes(i));
 return running()+`<div class="two"><section><h3 style="margin-bottom:10px">À décider (${need.length})</h3>${need.map(i=>`<div class="review-card"><div class="row between"><h3>${esc(i.name)}</h3>${badge(i)}</div>${route(i)}<p class="muted" style="margin-top:6px">${esc(i.why)}</p>${coverage(i)}${i.missing?`<div class="files">${i.missing.map(m=>`<div class="miss"><span>${esc(m)}</span><span>ignoré</span></div>`).join("")}</div>`:""}<div class="row">${decide(i)}</div></div>`).join("")||`<div class="empty">Rien à décider : tout ce qui correspond est ajouté seul.</div>`}</section>
 <section class="panel" style="padding:16px"><h3>Le reste se fait seul</h3><p class="muted" style="margin:4px 0 10px">${count("added")} ajoutés · ${items.filter(i=>["queued","searching","verifying"].includes(i.state)).length} en cours</p><div class="feed">${rest.map(i=>`<p><small>${i.when}</small><span>${badge(i)} ${esc(i.name)}<br>${route(i)}</span></p>`).join("")}</div>
 <div class="section"><b>Indexeurs</b>${INDEXERS.map(x=>`<p class="muted" style="margin:4px 0">${esc(x.name)} · ${esc(x.pace)}</p>`).join("")}</div></section></div>`}

function render(){document.getElementById("content").innerHTML=({A,B,C})[variant]();document.getElementById("label").textContent=`${variant} — ${variants.find(v=>v[0]===variant)[1]}`;document.getElementById("pause").textContent=paused?"Tout reprendre":"Tout suspendre"}
function set(id,state,extra={}){const i=items.find(x=>x.id===id);Object.assign(i,{state},extra);render()}
document.addEventListener("click",e=>{const t=e.target.closest("button,[data-item]");if(!t||t.closest("#switcher"))return;const d=t.dataset;
 if(d.filter){filter=d.filter;render()}else if(d.idx){idxFilter=d.idx;render()}else if(d.item){selected=+d.item;render()}
 else if(d.accept){set(+d.accept,"verifying",{when:"en cours",why:"Ajouté arrêté après votre accord ; vérification par le client."});setTimeout(()=>set(+d.accept,"added",{when:"à l'instant",why:"Vérifié à 100 % sur les fichiers présents, en partage."}),1800)}
 else if(d.reject){items=items.filter(x=>x.id!==+d.reject);selected=items[0].id;render()}
 else if(d.retry){set(+d.retry,"verifying",{when:"en cours"})}
 else if(d.remove){items=items.filter(x=>x.id!==+d.remove);selected=items[0].id;render()}});
document.getElementById("complete").onclick=()=>{const id=next++;items.unshift({id,name:"Le.Garcon.et.le.Heron.2023.MULTi.1080p",from:"c411",to:"nebula",state:"searching",cov:0,kind:"",size:"8,2 Go",when:"à l'instant",why:"Téléchargement terminé : recherche sur les autres indexeurs."});selected=id;render();
 setTimeout(()=>set(id,"verifying",{kind:"Full",cov:100,why:"Correspondance complète sur Nebula : ajouté arrêté, vérification."}),1500);setTimeout(()=>set(id,"added",{when:"à l'instant",why:"Vérifié à 100 %, en partage sur Nebula."}),3200)};
document.getElementById("pause").onclick=()=>{paused=!paused;render()};
document.getElementById("theme").onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==="light"?"dark":"light"};
function go(n){const k=variants.findIndex(v=>v[0]===variant);variant=variants[(k+n+variants.length)%variants.length][0];const u=new URL(location);u.searchParams.set("variant",variant);history.replaceState(null,"",u);render()}
document.getElementById("prev").onclick=()=>go(-1);document.getElementById("next").onclick=()=>go(1);
document.addEventListener("keydown",e=>{if(e.target.closest("input,select"))return;if(e.key==="ArrowLeft")go(-1);if(e.key==="ArrowRight")go(1)});
if(!variants.some(v=>v[0]===variant))variant="A";render();
</script>
