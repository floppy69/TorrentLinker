.link-button {background:transparent;border:0;padding:0;text-align:left;font-weight:500}
/* Assistant page, matching the desktop (gui/chat_composer.py, assistant.py). */

/* Search page (static/search.js): the same structure as the desktop Search tab. */
.spacer { flex: 1; }
.chip { border-radius: 999px; padding: 5px 12px; font-weight: 500; background: var(--panel); }

.search-head { display: flex; justify-content: flex-end; margin-bottom: 10px; }
.search-tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.fdrop { position: relative; }

.fdrop-panel { position: absolute; z-index: 20; top: calc(100% + 6px); left: 0; min-width: 240px; max-width: 320px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 12px 40px #00000033; padding: 10px; display: grid; gap: 8px; }
.fdrop-panel input[type="search"], .fdrop-panel input:not([type]), .fdrop-panel input[type="number"] { width: 100%; }
.fdrop-list { max-height: 240px; overflow: auto; display: grid; gap: 2px; }
.fdrop-item { display: flex; gap: 8px; align-items: center; padding: 4px 6px; border-radius: 6px; margin: 0; cursor: pointer; }
.fdrop-item:hover { background: var(--tint); }
.fdrop-item input { width: auto; }
.chip.page { min-width: 34px; border-radius: 8px; }
.chip.page[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 650; }
.results-card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; margin: 4px 0 12px; overflow: hidden; }
.results-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 12px 16px 2px; }

.results-sort { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 4px 12px 10px 16px; border-bottom: 1px solid var(--line); }
.search-sort { display: flex; flex-wrap: wrap; gap: 4px; }

.chip.sort:hover { background: var(--tint); color: var(--ink); }
.chip.sort[aria-pressed="true"] { background: var(--tint); border-color: var(--accent); color: var(--ink); }
.search-results { overflow-x: auto; }
.search-results .empty { margin: 0; padding: 60px 20px; text-align: center; color: var(--muted); }
.search-results.compact table { margin: 0; }
.sr-row { display: grid; grid-template-columns: 24px 52px minmax(0, 1fr) 120px 120px 150px 44px; gap: 14px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.sr-row:last-child { border-bottom: 0; }
.sr-row.selected { background: var(--tint); }
.sr-row input[type="checkbox"] { width: 16px; height: 16px; padding: 0; }
.cover { position: relative; width: 52px; height: 64px; border-radius: 6px; overflow: hidden; border: 1px solid var(--cover, var(--line)); background: color-mix(in srgb, var(--cover, #64748b) 16%, transparent); display: grid; place-items: center; }
.cover-letters { color: var(--cover, var(--muted)); font-weight: 650; font-size: .9em; }
.cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.sr-main { min-width: 0; display: grid; gap: 5px; }
.sr-line { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-width: 0; }
.sr-title { border: 0; background: transparent; padding: 0; font-weight: 650; font-size: 1.02em; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.sr-title:hover { background: transparent; text-decoration: underline; }

.tag-lang { --tag: #10b981; } .tag-resolution { --tag: #3b82f6; } .tag-source { --tag: #06b6d4; }
.tag-audio { --tag: #f59e0b; } .tag-codec { --tag: #94a3b8; } .tag-hdr { --tag: #a855f7; } .tag-zen { --tag: #14b8a6; }
.tag.rating { --tag: #f5b301; }
.tag.kind { --tag: #3b82f6; }

.mark-revival { color: #ef4444; } .mark-exclusive { color: #f5b301; }
.sr-stats { display: grid; gap: 4px; }

.torrent-layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 16px; align-items: start; }

.bar { position: relative; min-width: 90px; height: 16px; border-radius: 3px; background: var(--line); overflow: hidden; }

#torrent-details { margin-top: 12px; padding: 0; overflow: hidden; }
.detail-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); padding: 0 8px; }

.queue-context-menu { position: fixed; z-index: 1000; padding: 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); box-shadow: 0 8px 30px #0005; max-width: 100vw; }
.queue-context-menu button { display: block; width: 100%; text-align: left; margin: 2px 0; }

/* Leave room for the sticky status band when browser focus scrolls an embedded panel. */
html { scroll-padding-bottom: calc(var(--shell-band-height, 44px) + 16px); }
/* Embedded modal actions must remain above the sticky status band. */
iframe.has-open-dialog { position: relative; z-index: 3; }
#upload-frame[hidden]{display:none!important}
/* The bundled shell renders navigation, headings, update notices and the Zen band. */
#app-sidebar { padding:0; overflow:hidden; }
#shell-navigation-frame { width:100%; height:100%; border:0; display:block; }
#shell-header-frame { flex:1; width:100%; min-width:0; border:0; display:block; height:110px; }
#shell-band-frame,#shell-update-frame { width:100%; border:0; display:block; height:44px; }
#shell-band-host { position:sticky; bottom:0; background:var(--bg); z-index:2; }
#shell-update-host { margin-bottom:16px; }
#shell-help-dialog { width:min(500px,calc(100vw - 24px)); padding:0; }
#shell-help-frame { width:100%; height:320px; border:0; display:block; }
@media(max-width:650px) {
  #workspace #app-sidebar { position:relative; inset:auto; width:100%; display:block; height:auto; }
  #workspace main { margin-left:0; }
  #shell-navigation-frame { height:160px; }
  #navigation-toggle { display:inline-block; }
  #workspace main > header { display:flex; flex-wrap:wrap; padding:12px 0; }
  #shell-header-frame { flex:1 0 100%; order:2; }
  #work-status { margin-left:auto; }
}
@media(max-width:650px) { .navigation-collapsed #workspace #app-sidebar { display:none; } }
@media(min-width:651px) {
  #app-sidebar { position:fixed; width:190px; border-right:1px solid var(--line); }
  #workspace main { margin-left:190px; }
  .navigation-collapsed #workspace main { margin-left:0; }
}

#page-jobs small { overflow-wrap: anywhere; min-width: 0; }

<style>
/* Only what the welcome screen has no equivalent for yet. */
.welcome form{display:grid;gap:6px}.welcome form label{margin-top:8px}.welcome form input{width:100%}
.welcome.wide{max-width:820px}.welcome.tv{max-width:1100px;text-align:center}.welcome.tv .brandmark{margin:auto}
.field-error{color:var(--danger);font-size:13px;min-height:1em;margin:4px 0 0}
.linkish{background:none;border:0;color:var(--accent);padding:4px 0;width:auto!important;margin:0!important;text-decoration:underline;cursor:pointer}
.viewers{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px;margin-top:20px}
.viewer{display:grid;justify-items:center;gap:10px;padding:18px 10px;margin:0!important;width:auto!important}
.face{width:88px;height:88px;border-radius:22px;display:grid;place-items:center;font-size:34px;font-weight:700;color:#102a2b}
.viewer small{display:block}.lock{font-size:12px;color:var(--muted)}
.vlist{display:grid;gap:8px;margin-top:8px}.vrow{display:flex;align-items:center;gap:12px;text-align:left;justify-content:flex-start;margin:0!important;width:100%}
.vrow[aria-pressed=true]{border-color:var(--accent);background:var(--tint)}.vrow .face{width:38px;height:38px;border-radius:10px;font-size:16px}
.tv .viewers{grid-template-columns:repeat(auto-fit,minmax(200px,240px));justify-content:center;gap:26px}#page.tv p{text-align:center;margin-inline:auto}.tv .face{width:160px;height:160px;border-radius:32px;font-size:64px}.tv .viewer{font-size:20px}
.tv .viewer:focus-visible,.tv .viewer.focus{outline:4px solid var(--accent);outline-offset:6px;transform:scale(1.04)}
.pin{display:flex;gap:10px;justify-content:center;margin:16px 0}.pin i{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted)}.pin i.on{background:var(--accent);border-color:var(--accent)}
.keys{display:grid;grid-template-columns:repeat(3,64px);gap:10px;justify-content:center}.keys button{width:64px!important;height:56px;margin:0!important;font-size:20px}
dialog{border:1px solid var(--line);border-radius:15px;background:var(--panel);color:var(--text);padding:24px;width:min(380px,92vw);text-align:center}dialog::backdrop{background:#0009}
#switcher{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;background:#0d1216;color:#fff;border:1px solid #ffffff40;border-radius:999px;padding:6px 8px;box-shadow:0 10px 40px #0008;z-index:50;font-size:13px}
#switcher button,#switcher select{background:#ffffff14;border:1px solid #ffffff30;color:#fff;border-radius:999px;padding:4px 12px;width:auto;margin:0}#switcher b{min-width:170px;text-align:center}
</style>
<section class="welcome" id="page"></section>
<dialog id="pin"></dialog>
<div id="switcher"><button id="prev" aria-label="Variante précédente">←</button><b id="label"></b><button id="next" aria-label="Variante suivante">→</button>
 <select id="screen" aria-label="Écran"><option value="who">Qui regarde ? (les 3 variantes)</option><option value="signin">Connexion (commune)</option><option value="owner">Propriétaire</option><option value="wrong">Mauvais mot de passe</option><option value="throttled">Trop d'essais</option></select><button id="theme">Thème</button></div>
<script>
const OWNER="Vincent";
const VIEWERS=[{name:"Léa",colour:"#f4b26a",pin:"1234",note:"Tout ce que Léa peut voir"},{name:"Hugo",colour:"#8fd0ff",pin:"",note:"Enfant · -10 ans, films et animés"},{name:"Mamie",colour:"#c7a6ff",pin:"",note:"Films et séries"}];
const BRAND=`<img class="brandmark" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNTYgMjU2Ij4KICA8ZGVmcz4KICAgIDxsaW5lYXJHcmFkaWVudCBpZD0ibGluayIgZ3JhZGllbnRVbml0cz0idXNlclNwYWNlT25Vc2UiIHgxPSI5NiIgeTE9IjAiIHgyPSIxODQiIHkyPSIwIj4KICAgICAgPHN0b3Agb2Zmc2V0PSIwIiBzdG9wLWNvbG9yPSIjNDViZGIyIi8+PHN0b3Agb2Zmc2V0PSIxIiBzdG9wLWNvbG9yPSIjZThmMWVlIi8+CiAgICA8L2xpbmVhckdyYWRpZW50PgogIDwvZGVmcz4KICA8cmVjdCB3aWR0aD0iMjU2IiBoZWlnaHQ9IjI1NiIgcng9IjU2IiBmaWxsPSIjMTMyYTJmIi8+CiAgPHBhdGggZD0iTTg2IDc2IFYyMDYiIHN0cm9rZT0iIzQ1YmRiMiIgc3Ryb2tlLXdpZHRoPSI0MCIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIi8+CiAgPHBhdGggZD0iTTE4NCA1NiBWMjA2IEgyMjIiIGZpbGw9Im5vbmUiIHN0cm9rZT0iI2U4ZjFlZSIgc3Ryb2tlLXdpZHRoPSI0MCIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIi8+CiAgPHBhdGggZD0iTTM4IDc2IEgxODQiIHN0cm9rZT0idXJsKCNsaW5rKSIgc3Ryb2tlLXdpZHRoPSI0MCIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIi8+Cjwvc3ZnPgo=" alt="" width="64" height="64">`;
const variants=[["A","Avatars"],["B","Dans la carte"],["C","Grand écran"]];
const params=new URLSearchParams(location.search);
let shared=true,screenName="Télé du salon",variant=params.get("variant")||"A",screen=params.get("screen")||"who",picked=null,entered="",focusIdx=0,watching=null;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
const head=(t,p)=>`${BRAND}<h1>${t}</h1><p>${p}</p>`;
const face=v=>`<span class="face" style="background:${v.colour}">${v.name[0]}</span>`;

/* Signing in: the Web shell's welcome card, with a sign-in name now. */
function signin(){const owner=screen==="owner",wrong=screen==="wrong",throttled=screen==="throttled";
 return `${head("TorrentLinker","Vos torrents, où qu'ils soient.")}
 <form class="card" onsubmit="return false">
 ${owner?"":`<label for="login">Identifiant</label><input id="login" autocomplete="username" value="${wrong||throttled?"lea":""}">`}
 <label for="pw">${owner?"Mot de passe du serveur":"Mot de passe"}</label><input id="pw" type="password" autocomplete="current-password" ${throttled?"disabled":""}>
 ${owner?"":`<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" data-shared ${shared?"checked":""} style="width:auto;margin:0"> Cet écran est partagé</label>
  ${shared?`<label for="screen-name">Nom de cet écran</label><input id="screen-name" data-screen-name value="${esc(screenName)}"><small class="muted">On y demandera qui regarde ; il reste connecté 90 jours sans usage. Vous pourrez l'oublier depuis votre compte.</small>`:""}`}
 <p class="field-error" role="alert">${wrong?"Identifiant ou mot de passe incorrect.":throttled?"Trop d'essais. Réessayez dans une minute.":""}</p>
 <button class="primary" data-signin ${throttled?"disabled":""}>Se connecter</button>
 <p class="muted">${owner?"Le mot de passe choisi au démarrage du serveur.":`Mot de passe oublié ? Demandez à ${OWNER} un nouveau lien.`}</p>
 <button class="linkish" data-toggle-owner>${owner?"Je suis membre":"Je suis le propriétaire"}</button></form>`}

/* A · Avatars: who watches, as large faces after signing in. */
function A(){return `${head("Qui regarde ?",`${esc(screenName)} · écran partagé de Léa`)}<div class="viewers">${VIEWERS.map((v,i)=>`<button class="viewer" data-pick="${i}">${face(v)}<strong>${v.name}</strong><span class="lock">${v.pin?"🔒 Code":" "}</span></button>`).join("")}</div>
 <p class="muted" style="margin-top:20px">Chacun garde sa reprise de lecture et ses listes. <button class="linkish">Gérer les profils</button> · <button class="linkish" data-out>Se déconnecter</button></p>`}

/* B · Dans la carte: the choice stays in the sign-in card, the code inline. */
function B(){const v=VIEWERS[picked??0];return `${head("Qui regarde ?",`${esc(screenName)} · écran partagé de Léa`)}
 <form class="card" onsubmit="return false"><div class="vlist">${VIEWERS.map((w,i)=>`<button class="vrow" data-select="${i}" aria-pressed="${(picked??0)===i}">${face(w)}<span><strong>${w.name}</strong><br><small class="muted">${w.note}</small></span><span class="lock" style="margin-left:auto">${w.pin?"🔒":""}</span></button>`).join("")}</div>
 ${v.pin?`<label for="code">Code de ${v.name}</label><input id="code" inputmode="numeric" maxlength="4" autocomplete="off" value="${entered}" data-code>`:""}
 <p class="field-error" role="alert">${entered.length===4&&entered!==v.pin?"Code incorrect.":""}</p>
 <button class="primary" data-enter ${v.pin&&entered!==v.pin?"disabled":""}>Regarder en tant que ${v.name}</button>
 <button class="linkish" data-out>Se déconnecter</button></form>`}

/* C · Grand écran: big tiles for a TV, moved with the arrows or a remote. */
function C(){return `${head("Qui regarde ?",`${esc(screenName)} · flèches pour choisir, OK pour entrer`)}<div class="viewers">${VIEWERS.map((v,i)=>`<button class="viewer ${i===focusIdx?"focus":""}" data-pick="${i}" tabindex="${i===focusIdx?0:-1}">${face(v)}<strong>${v.name}</strong><span class="lock">${v.pin?"🔒 Code":" "}</span></button>`).join("")}</div>`}

function pinDialog(i){const v=VIEWERS[i],dlg=document.getElementById("pin");picked=i;entered="";
 const draw=()=>{dlg.innerHTML=`${face(v)}<h2 style="margin:12px 0 4px">${v.name}</h2><p class="muted" style="margin:0">Code à 4 chiffres</p>
  <div class="pin">${[0,1,2,3].map(k=>`<i class="${k<entered.length?"on":""}"></i>`).join("")}</div>
  <p class="field-error" role="alert">${entered.length===4&&entered!==v.pin?"Code incorrect.":""}</p>
  <div class="keys">${[1,2,3,4,5,6,7,8,9,"",0,"⌫"].map(k=>k===""?"<span></span>":`<button data-key="${k}">${k}</button>`).join("")}</div>
  <button style="margin-top:14px" data-close-pin>Annuler</button>`;dlg.querySelector(".face").style.margin="auto"};
 dlg.redraw=draw;draw();dlg.showModal()}
function enter(i){watching=VIEWERS[i];document.getElementById("pin").close();render()}
function watchingScreen(){return `${head(`Bonne séance, ${watching.name}`,watching.note)}<div class="card"><p>Médias s'ouvre avec la reprise de lecture et les listes de ${watching.name}.</p><button class="primary">Ouvrir Médias</button><button data-switch>Changer de profil</button></div>`}

function render(){const page=document.getElementById("page");
 page.className="welcome"+(screen==="who"&&!watching?variant==="C"?" tv":variant==="A"?" wide":"":"");
 page.innerHTML=watching?watchingScreen():screen==="who"?({A,B,C})[variant]():signin();
 document.getElementById("label").textContent=`${variant} — ${variants.find(v=>v[0]===variant)[1]}`;document.getElementById("screen").value=screen;
 if(screen==="who"&&variant==="C"&&!watching)page.querySelector(".viewer.focus")?.focus()}
document.addEventListener("change",e=>{if("shared" in e.target.dataset){shared=e.target.checked;render()}});
document.addEventListener("input",e=>{if("screenName" in e.target.dataset){screenName=e.target.value;return}if("code" in e.target.dataset){entered=e.target.value.replace(/\D/g,"").slice(0,4);render();const c=document.getElementById("code");c?.focus();c?.setSelectionRange(entered.length,entered.length)}});
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t||t.closest("#switcher"))return;const d=t.dataset;
 if("signin" in d){const pw=document.getElementById("pw").value;if(pw==="faux"){screen="wrong"}else if(screen!=="owner"&&!shared){watching=VIEWERS[0]}else{screen="who"}render()}
 else if("toggleOwner" in d){screen=screen==="owner"?"signin":"owner";render()}
 else if(d.pick){const i=+d.pick;if(VIEWERS[i].pin)pinDialog(i);else enter(i)}
 else if(d.select){picked=+d.select;entered="";render()}
 else if("enter" in d){enter(picked??0)}
 else if(d.key!==undefined){const dlg=document.getElementById("pin");entered=d.key==="⌫"?entered.slice(0,-1):(entered+d.key).slice(0,4);dlg.redraw();if(entered===VIEWERS[picked].pin)setTimeout(()=>enter(picked),200)}
 else if("closePin" in d){document.getElementById("pin").close()}
 else if("switch" in d){watching=null;render()}
 else if("out" in d){screen="signin";watching=null;render()}});
document.addEventListener("keydown",e=>{const dlg=document.getElementById("pin");
 if(dlg.open&&/^[0-9]$/.test(e.key)){entered=(entered+e.key).slice(0,4);dlg.redraw();if(entered===VIEWERS[picked].pin)setTimeout(()=>enter(picked),200);return}
 if(screen==="who"&&variant==="C"&&!watching&&!dlg.open&&["ArrowLeft","ArrowRight"].includes(e.key)){focusIdx=(focusIdx+(e.key==="ArrowRight"?1:-1)+VIEWERS.length)%VIEWERS.length;render();e.preventDefault();return}
 if(e.target.closest("input,textarea,select")||dlg.open)return;if(e.key==="ArrowLeft")go(-1);if(e.key==="ArrowRight")go(1)});
function go(n){const i=variants.findIndex(v=>v[0]===variant);variant=variants[(i+n+variants.length)%variants.length][0];screen="who";watching=null;picked=null;entered="";const u=new URL(location);u.searchParams.set("variant",variant);history.replaceState(null,"",u);render()}
document.getElementById("prev").onclick=()=>go(-1);document.getElementById("next").onclick=()=>go(1);
document.getElementById("screen").onchange=e=>{screen=e.target.value;watching=null;render()};
document.getElementById("theme").onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==="light"?"dark":"light"};
if(!variants.some(v=>v[0]===variant))variant="A";render();
</script>
