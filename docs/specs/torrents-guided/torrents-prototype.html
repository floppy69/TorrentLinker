function moreActions(){const d=$('dialog');d.innerHTML=`<h2>${t('Actions sur la sélection','Selection actions')}</h2><p>${selected.size} torrents</p><div class="toolbar">${[['recheck',t('Vérifier les fichiers','Recheck files')],['announce',t('Réannoncer','Reannounce')],['limits',t('Limites de vitesse','Speed limits')],['category',t('Catégorie et tags','Category and tags')],['location',t('Changer le dossier','Change location')]].map(([a,n])=>`<button data-more="${a}">${n}</button>`).join('')}<button id="transfer">${t('Transférer vers un autre client…','Transfer to another client…')}</button></div><p class="muted">${t('Les opérations non prises en charge seront désactivées par client dans l’application.','Unsupported operations will be disabled per client in the app.')}</p><button id="close-more">${t('Fermer','Close')}</button>`;d.showModal();$('close-more').onclick=()=>d.close();d.querySelectorAll('[data-more]').forEach(b=>b.onclick=()=>{d.close();if(['limits','category','location'].includes(b.dataset.more))editAction(b.dataset.more);else confirmAction(b.dataset.more)});$('transfer').onclick=transferPlan}
function editAction(action){const d=$('dialog');const title={limits:t('Limites de vitesse','Speed limits'),category:t('Catégorie et tags','Category and tags'),location:t('Dossier du client actuel','Current client folder')}[action];d.innerHTML=`<h2>${title}</h2><p>${selected.size} torrents</p><p><label>${action==='limits'?t('Réception KiB/s · 0 = illimité','Download KiB/s · 0 = unlimited'):action==='category'?t('Catégorie','Category'):t('Chemin accessible au client','Client-accessible path')}<input id="value" value="${action==='location'?'/downloads/archives':action==='limits'?'0':''}"></label></p>${action==='limits'?`<p><label>${t('Envoi KiB/s','Upload KiB/s')}<input value="0" type="number" min="0"></label></p>`:action==='category'?'<p><label>Tags <input placeholder="Favoris, Archives"></label></p>':''}<button id="cancel-edit">${t('Annuler','Cancel')}</button> <button id="apply-edit">${t('Appliquer dans l’aperçu','Apply in preview')}</button>`;d.showModal();$('cancel-edit').onclick=()=>d.close();$('apply-edit').onclick=()=>{if(action==='category')data.filter(r=>selected.has(r.id)).forEach(r=>r.category=$('value').value||r.category);d.close();render();notify(t('Modification simulée.','Change simulated.'))}}
function transferPlan(){const chosen=data.filter(r=>selected.has(r.id));const destinations=['NAS · Transmission','PC · qBittorrent'].sort((a,b)=>chosen.filter(r=>r.client===a).length-chosen.filter(r=>r.client===b).length);const d=$('dialog');d.innerHTML=`<h2>${t('Transférer vers un autre client','Transfer to another client')}</h2><p>${t('Proposition pour le suivi multi-client. Aucun transfert réel.','Proposal for the multi-client follow-up. No real transfer.')}</p><p>${selected.size} torrents · ${t('la source reste en place','source remains in place')}</p><label>${t('Destination','Destination')} <select id="destination">${destinations.map(v=>`<option>${v}</option>`).join('')}</select></label><p class="muted">${t("Les torrents déjà sur la destination seront ignorés et signalés dans le plan.","Torrents already on the destination will be skipped and listed in the plan.")}</p><p><label>${t('Dossier sur la destination','Destination folder')} <input value="/data/torrents"></label></p><p><label>${t('Accès aux fichiers','File access')} <select id="method"><option>${t('Réutiliser un dossier partagé','Reuse a shared folder')}</option><option>${t('Copier vers la destination','Copy to destination')}</option></select></label></p><ol><li>${t('Vérifier accès, espace disponible, mappings et doublons','Check access, free space, path mappings and duplicates')}</li><li>${t('Préparer les données sans effacer la source','Prepare data without deleting the source')}</li><li>${t('Ajouter en pause puis vérifier les hashes sur la destination','Add paused, then hash-check on destination')}</li><li>${t('Démarrer le seed et confirmer son état','Start seeding and confirm its state')}</li><li>${t('Proposer ensuite le retrait à la source, séparément','Offer source removal afterwards, separately')}</li></ol><button id="cancel-transfer">${t('Annuler','Cancel')}</button> <button id="simulate-transfer" class="primary">${t('Simuler la vérification du plan','Simulate plan validation')}</button>`;d.showModal();$('cancel-transfer').onclick=()=>d.close();$('simulate-transfer').onclick=()=>{d.innerHTML=`<h2>${t('Plan de transfert prêt · simulation','Transfer plan ready · simulation')}</h2><p>${t('Destination accessible, aucune collision. La source sera conservée jusqu’à la vérification complète et au seed confirmé. Une erreur laisse la source intacte et permet de reprendre.','Destination accessible, no conflict. Source is retained until verification completes and seeding is confirmed. Failure preserves the source and allows resume.')}</p><p class="note">${t('Le retrait des données source nécessite une décision distincte. Avec un dossier partagé, retirer le torrent ne doit jamais effacer les fichiers utilisés par la destination.','Removing source data requires a separate decision. With shared storage, removing the source torrent must never delete data used by the destination.')}</p><button id="finish-transfer">${t('Fermer','Close')}</button>`;$('finish-transfer').onclick=()=>d.close()}}
function bind(){document.querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{sortDir=sortKey===b.dataset.sort?-sortDir:1;sortKey=b.dataset.sort;page=0;render();document.querySelector('[data-sort="'+sortKey+'"]').focus()});document.querySelectorAll('[data-metric]').forEach(e=>e.onchange=()=>{metrics[e.dataset.metric]=e.value;page=0;render()});document.querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>{const k=b.dataset.unit,v=document.querySelector(`[data-metric="${k}"]`).value,toMiB=sizeUnits[k]==='GiB';sizeUnits[k]=toMiB?'MiB':'GiB';metrics[k]=v===''?'':String(Number(v)*(toMiB?1024:1/1024));page=0;render()});$('clear-filters').onclick=()=>{Object.keys(metrics).forEach(k=>metrics[k]='');Object.keys(filters).forEach(k=>filters[k]='');query='';page=0;render()};$('more-actions').onclick=moreActions;$('client').value=client;$('client').onchange=e=>{client=e.target.value;page=0;render()};$('query').oninput=e=>{query=e.target.value;page=0;const pos=e.target.selectionStart;render();$('query').focus();$('query').setSelectionRange(pos,pos)};document.querySelectorAll('[data-filter]').forEach(s=>s.onchange=()=>{filters[s.dataset.filter]=s.value;page=0;render()});document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{focus=+b.dataset.open;render()});document.querySelectorAll('[data-select]').forEach(c=>c.onchange=()=>{c.checked?selected.add(+c.dataset.select):selected.delete(+c.dataset.select);render()});$('select-page')&&($('select-page').onchange=e=>{matching().slice(page*100,page*100+100).forEach(r=>e.target.checked?selected.add(r.id):selected.delete(r.id));render()});$('prev').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render()};$('retry')&&($('retry').onclick=()=>{scenario='normal';$('scenario').value=scenario;render()});$('columns').onclick=()=>{const d=$('dialog');d.innerHTML=`<h2>${t('Colonnes affichées','Visible columns')}</h2><p class="muted">${t('Même choix sur desktop et Web. Dans cet aperçu, conservé en mémoire.','Same choices on desktop and Web. Kept in memory in this preview.')}</p>${Object.keys(cols).map(k=>`<label class="column"><input data-col="${k}" type="checkbox" ${cols[k]?'checked':''}> ${labels[k]()}</label>`).join('')}<button id="done">${t('Terminé','Done')}</button>`;d.showModal();d.querySelectorAll('[data-col]').forEach(c=>c.onchange=()=>{cols[c.dataset.col]=c.checked;render()});$('done').onclick=()=>d.close()};$('trackers').onclick=()=>{const d=$('dialog');d.innerHTML=`<h2>${t('Trackers et clients','Trackers and clients')}</h2>${['Tracker A','Tracker B'].map(tr=>`<details open><summary>${tr}</summary>${['PC · qBittorrent','NAS · Transmission'].map(c=>`<p><button data-tr="${tr}" data-client="${c}">${c} · ${data.filter(r=>r.tracker===tr&&r.client===c).length}</button></p>`).join('')}</details>`).join('')}<button id="close-tree">${t('Fermer','Close')}</button>`;d.showModal();d.querySelectorAll('[data-tr]').forEach(b=>b.onclick=()=>{filters.tracker=b.dataset.tr;client=b.dataset.client;page=0;d.close();render()});$('close-tree').onclick=()=>d.close()};document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>confirmAction(b.dataset.action))}
function confirmAction(action){const chosen=data.filter(r=>selected.has(r.id)),clients=[...new Set(chosen.map(r=>r.client))],d=$('dialog');d.innerHTML=`<h2>${({pause:t('Suspendre','Pause'),resume:t('Reprendre','Resume'),delete:t('Retirer','Remove'),recheck:t('Vérifier les fichiers','Recheck files'),reannounce:t('Réannoncer','Reannounce')})[action]||t('Confirmer l’action','Confirm action')}</h2><p>${chosen.length} torrents · ${clients.join(' / ')}</p><p>${t('Seuls les éléments sélectionnés sont concernés, y compris ceux sur d’autres pages.','Only selected items are affected, including those on other pages.')}</p>${action==='delete'?`<label class="column"><input id="delete-files" type="checkbox">${t('Supprimer aussi les fichiers','Also delete files')}</label><p id="danger"></p>`:''}<div class="row"><button id="cancel">${t('Annuler','Cancel')}</button><button id="confirm" class="primary">${t('Confirmer dans l’aperçu','Confirm in preview')}</button></div>`;d.showModal();$('cancel').onclick=()=>d.close();$('delete-files')&&($('delete-files').onchange=e=>{$('danger').textContent=e.target.checked?t('Les fichiers seraient définitivement supprimés.','Files would be permanently deleted.'):''});$('confirm').onclick=()=>{if(action==='delete'&&$('delete-files').checked){d.innerHTML=`<h2>${t('Supprimer les fichiers de ces torrents ?','Delete these torrents’ files?')}</h2><p>${chosen.length} torrents · ${clients.join(' / ')}</p><button id="cancel-final">${t('Annuler','Cancel')}</button> <button id="delete-final">${t('Simuler la suppression définitive','Simulate permanent deletion')}</button>`;$('cancel-final').onclick=()=>d.close();$('delete-final').onclick=()=>apply();}else apply()};function apply(){if(action==='delete')chosen.forEach(r=>data.splice(data.indexOf(r),1));else if(['pause','resume'].includes(action))chosen.forEach(r=>r.state=action==='pause'?'paused':'seeding');selected.clear();d.close();render();notify(t('Action simulée. Aucun client contacté.','Action simulated. No client contacted.'))}}
for(const key of ['mode','lang','theme']){$(key).value=({mode,lang,theme})[key];$(key).onchange=e=>{if(key==='mode')mode=e.target.value;if(key==='lang')lang=e.target.value;if(key==='theme')theme=e.target.value;history.replaceState(null,'','?mode='+mode+'&lang='+lang+'&theme='+theme);render()}}$('scenario').onchange=e=>{scenario=e.target.value;render()};$('reset').onclick=()=>location.reload();render();
</script></html>
