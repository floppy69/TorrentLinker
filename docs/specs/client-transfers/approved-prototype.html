    ${s.stage==='setup'?`<div class="transfer-grid"><section class="panel transfer-card"><h3>${t('Destination','Destination')}</h3><label>${t('Client','Client')}<select id="transfer-destination">${!s.destination?`<option value="" selected disabled>${t('Aucun autre client disponible','No other client available')}</option>`:''}${transferClients.map(client=>`<option value="${escape(client)}" ${isSourceClient(s,client)?'disabled':''}>${escape(client)}${isSourceClient(s,client)?t(' · source',' · source'):''}</option>`).join('')}</select></label><label>${t('Accès aux fichiers','File access')}<select id="transfer-method"><option value="shared" ${canReuse(s)?'':'disabled'}>${t('Réutiliser un dossier partagé','Reuse a shared folder')}</option><option value="copy">${canCopy(s)?t('Copier vers un autre dossier','Copy to another folder'):t('Copie indisponible · accès à configurer','Copy unavailable · configure access')}</option></select></label><p class="muted">${canReuse(s)?t('Les dossiers configurés correspondent au même stockage accessible aux deux clients.','Configured folders resolve to the same storage accessible to both clients.'):canCopy(s)?t('Stockages distincts. Copie via les dossiers accessibles à TorrentLinker ; aucune réutilisation de fichiers partagés configurée.','Separate storage. Copy through folders accessible to TorrentLinker; no shared-file reuse is configured.'):t('Aucun stockage partagé ni accès de copie configuré. Configurez un montage accessible avant de transférer.','No shared storage or copy access configured. Configure an accessible mount before transferring.')}</p><h4>${t('Dossiers par catégorie','Category folders')}</h4><p class="muted">${t('Dossiers configurés pour ce client. Vous pouvez choisir une autre destination pour ce transfert.','Folders configured for this client. You can choose another destination for this transfer.')}</p>${[...new Set(s.rows.map(r=>r.category))].map((category,i)=>{const row=s.rows.find(r=>r.category===category),path=destinationFolder(s,row),configured=configuredFolders[s.destination]?.[category];return `<div class="transfer-category"><strong>${escape(category)}</strong>${configured?`<p class="muted">${t('Dossier configuré','Configured folder')} · ${escape(configured)}</p>`:`<p class="muted">${t('Aucun dossier configuré','No folder configured')}</p>`}<label>${t('Destination pour ce transfert','Destination for this transfer')}<div class="transfer-path"><input data-folder-category="${escape(category)}" value="${escape(path)}" placeholder="${t('Chemin accessible au client','Client-accessible path')}"><button data-folder-browse="${i}">${t('Parcourir…','Browse…')}</button></div></label>${configured?`<button type="button" data-folder-default="${i}">${t('Rétablir le dossier configuré','Restore configured folder')}</button>`:''}<small class="muted">${t('Ce choix ne modifie pas les réglages de catégorie du client.','This choice does not change the client’s category settings.')}</small></div>`}).join('')}<p class="muted">${t('Les dossiers source sont conservés et affichés pour chaque torrent dans le plan. Parcourir utilise les dossiers accessibles à TorrentLinker ; pour un client distant, renseigner son chemin.','Source folders are retained and shown per torrent in the plan. Browse uses folders accessible to TorrentLinker; for a remote client, enter its path.')}</p></section>
    <section class="panel transfer-card"><h3>${t('Avant de commencer','Before starting')}</h3><h4>${t('À la source, après le transfert','At the source, after transfer')}</h4><div class="cleanup-toggles"><label><input type="checkbox" role="switch" id="cleanup-torrent" ${s.removeTorrent?'checked':''}>${t('Retirer le torrent','Remove torrent')}</label><label><input type="checkbox" role="switch" id="cleanup-files" ${s.removeFiles?'checked':''} ${s.method==='shared'?'disabled':''}>${t('Supprimer les fichiers','Delete files')}</label></div><p class="muted">${s.method==='shared'?t('Les fichiers partagés restent utilisés par la destination.','The destination still uses the shared files.'):s.removeFiles&&!s.removeTorrent?t('Le torrent source sera conservé en pause, sans ses fichiers.','The source torrent will remain paused, without its files.'):t('Vous pouvez retirer le torrent, ses fichiers, les deux, ou tout conserver.','Remove the torrent, its files, both, or keep everything.')}</p><p class="muted">${t('Seulement après vérification et seed confirmé à destination. Une confirmation précisera les suppressions.','Only after verification and confirmed destination seeding. A confirmation will list the removals.')}</p><p>${s.rows.length} torrents · ${s.rows.reduce((a,r)=>a+r.size,0).toFixed(1)} GiB</p><p>${s.method==='shared'?t('Les deux clients utilisent les mêmes fichiers. Aucune copie ; le chemin peut différer sur chaque machine.','Both clients use the same files. No copy; each machine may use a different path.'):t('La source reste intacte. La copie nécessite des dossiers accessibles en lecture et écriture à TorrentLinker.','The source stays intact. Copying requires folders TorrentLinker can read and write.')}</p><ul><li>${t('Contrôler les chemins, droits et espace disponible.','Check paths, permissions and free space.')}</li><li>${t('Signaler les doublons et différer les fichiers incomplets.','Report duplicates and defer incomplete files.')}</li><li>${t('Ajouter en pause, vérifier le contenu, puis confirmer le seed.','Add paused, verify content, then confirm seeding.')}</li></ul><div class="note">${s.method==='shared'?t('La destination utilise les mêmes fichiers. Seul le torrent source pourra être retiré, sans supprimer les fichiers.','The destination uses the same files. Only the source registration can be removed; files must stay.'):t('Après copie vérifiée et seed confirmé, vous pourrez conserver la source, retirer le torrent seul ou supprimer aussi ses fichiers source.','After a verified copy and confirmed seeding, you can keep the source, remove its registration only, or also delete its source files.')}</div></section></div>`:
    `<div class="note">${escape(s.destination)} · ${t('Dossiers par catégorie','Category folders')} · ${s.method==='shared'?t('Dossier partagé · aucune copie','Shared folder · no copy'):t('Copie · source conservée','Copy · source retained')}</div>
    <p class="note">${t('Nettoyage prévu après réussite','Cleanup planned after success')} · ${s.removeTorrent?t('retirer le torrent source','remove source torrent'):t('conserver le torrent source','keep source torrent')} · ${s.removeFiles?t('supprimer les fichiers source','delete source files'):t('conserver les fichiers','keep files')}</p><div class="transfer-list">${s.rows.map(r=>`<article class="panel transfer-item ${transferBlocked(r)?'transfer-blocked':''}"><div><strong>${escape(r.name)}</strong><p class="muted">${escape(r.category)} · ${escape(r.sourcePath)} → ${destinationFolder(s,r)?escape(destinationFolder(s,r)):`<strong class="missing-destination">${t('⚠ Dossier destination manquant','⚠ Missing destination folder')}</strong>`}<br>${escape(r.sourceClient)} → ${escape(s.destination)} · ${r.size} GiB · ${r.sourcePaused?t('Torrent source conservé en pause · fichiers supprimés','Source registration retained and paused · files removed'):r.sourceRetained?t('Source conservée','Source retained'):r.sourceFilesRemoved?t('Torrent et fichiers source supprimés · copie destination conservée','Source registration and files removed · destination copy retained'):t('Torrent retiré à la source · fichiers conservés','Source registration removed · files retained')}</p></div><div><span class="badge ${transferBlocked(r)?'blocking-badge':''}">${transferBlocked(r)?t('⚠ Bloqué · ','⚠ Blocked · '):''}${transferText(r.status)}</span>${s.stage==='review'&&transferBlocked(r)?`<p><button data-transfer-fix="${r.id}">${r.status==='missing-folder'?t('Configurer le dossier…','Configure folder…'):t('Corriger la préparation…','Fix preparation…')}</button></p>`:''}${['copying','adding','verifying','seeding','revalidating'].includes(r.status)?`<p><button data-transfer-advance="${r.id}" ${s.paused?'disabled':''}>${t('Simuler l’étape suivante','Simulate next step')}</button></p>`:''}${r.status==='failed'?`<p>${t('Le contenu ne correspond pas. La source est inchangée.','Content did not match. The source is unchanged.')}</p><button data-transfer-retry="${r.id}">${t('Réessayer après correction','Retry after correction')}</button>`:''}${r.status==='confirmed'&&!r.cleanupDone&&(s.removeTorrent||s.removeFiles)?`<p><button data-transfer-remove="${r.id}">${t('Confirmer le nettoyage prévu…','Confirm planned cleanup…')}</button></p>`:''}${r.status==='unsupported'?`<p>${t('Ce client ne fournit pas de transport de fichiers. Monter un dossier accessible ou conserver la source.','This client supplies no file transport. Mount an accessible folder or keep the source.')}</p>`:''}${r.status==='duplicate'?`<p>${t('Aucun ajout et aucun retrait de la source.','No torrent added; source retained.')}</p>`:''}</div>${transferProgress(r)}<details><summary>${t('Historique de cet élément','This item’s history')}</summary><ol>${r.events.map(e=>`<li>${transferText(e)}</li>`).join('')}</ol></details></article>`).join('')}</div>`}
    ${s.stage==='review'&&!transferCanStart(s)?`<p role="status" class="note transfer-blocking-summary">⚠ ${t('Démarrage bloqué. Corrigez tous les éléments signalés avant de transférer :','Start blocked. Resolve all flagged items before transferring:')} ${[...new Set(s.rows.filter(r=>r.status!=='ready').map(r=>transferText(r.status)))].join(' · ')}.</p>`:''}<div class="transfer-footer"><div>${s.stage==='setup'?`<label>${t('Scénario de démonstration','Demo scenario')} <select id="transfer-scenario">${scenarios.map(([v,fr,en])=>`<option value="${v}" ${s.scenario===v?'selected':''}>${t(fr,en)}</option>`).join('')}</select></label>`:`<button id="transfer-reset">${t('Recommencer la simulation','Restart simulation')}</button>`}</div><div>${s.stage==='setup'?`<button class="primary" id="transfer-check">${t('Vérifier le plan','Check the plan')}</button>`:s.stage==='review'?`<button id="transfer-back">${t('Modifier','Edit')}</button> <button class="primary" id="transfer-start" ${transferCanStart(s)?'':'disabled'}>${t('Démarrer le transfert','Start transfer')}</button>`:`${s.paused?`<button id="transfer-resume">${t('Reprendre après interruption','Resume after interruption')}</button>`:`<button id="transfer-interrupt" ${s.rows.some(r=>['copying','adding','verifying','seeding','revalidating'].includes(r.status))?'':'disabled'}>${t('Simuler une interruption','Simulate interruption')}</button>`} <button class="primary" id="transfer-next" ${s.paused||!s.rows.some(r=>['copying','adding','verifying','seeding','revalidating'].includes(r.status))?'disabled':''}>${t('Simuler la progression','Simulate progress')}</button>`}</div></div>`;
  $('transfer-close').onclick=()=>{d.close();d.classList.remove('transfer-dialog')};
  const on=(id,fn)=>{if($(id))$(id).onclick=fn};
  if(s.stage==='setup'){
    $('transfer-method').value=s.method;$('transfer-destination').value=s.destination;
    const config=()=>{const overrides=structuredClone(s.overrides);overrides[s.destination]||={};d.querySelectorAll('[data-folder-category]').forEach(input=>overrides[s.destination][input.dataset.folderCategory]=input.value);return {destination:$('transfer-destination').value,method:$('transfer-method').value,removeTorrent:$('cleanup-torrent').checked,removeFiles:$('cleanup-files').checked,overrides,scenario:$('transfer-scenario').value}};
    $('transfer-destination').onchange=()=>transferSend({type:'configure',values:config()});
    $('cleanup-torrent').onchange=()=>transferSend({type:'configure',values:config()});
    $('cleanup-files').onchange=()=>transferSend({type:'configure',values:config()});
    $('transfer-method').onchange=()=>transferSend({type:'configure',values:config()});
    $('transfer-scenario').onchange=()=>{const values=config();if(['space','unsupported'].includes(values.scenario))values.method='copy';transferSend({type:'configure',values})};
    d.querySelectorAll('[data-folder-browse]').forEach(b=>b.onclick=()=>{b.previousElementSibling.value='/mnt/shared/'+b.previousElementSibling.dataset.folderCategory.toLowerCase()});
    d.querySelectorAll('[data-folder-default]').forEach(b=>b.onclick=()=>{const input=b.parentElement.querySelector('[data-folder-category]');input.value=configuredFolders[s.destination][input.dataset.folderCategory];});
    on('transfer-check',()=>{transferState=TransferFlow.reduce(transferState,{type:'configure',values:config()});transferSend({type:'check'})});
  }
  d.querySelectorAll('[data-transfer-fix]').forEach(b=>b.onclick=()=>{const row=s.rows.find(r=>r.id===+b.dataset.transferFix);transferState.stage='setup';drawTransfer();const input=Array.from(d.querySelectorAll('[data-folder-category]')).find(el=>el.dataset.folderCategory===row.category);const target=input||$('transfer-destination');target.focus();target.scrollIntoView({block:'center'});});
  on('transfer-back',()=>{transferState.stage='setup';drawTransfer()});
  on('transfer-start',()=>transferSend({type:'start'}));on('transfer-next',()=>transferSend({type:'advance'}));
  on('transfer-reset',()=>transferPlan(true));on('transfer-interrupt',()=>transferSend({type:'interrupt'}));on('transfer-resume',()=>transferSend({type:'resume'}));
  d.querySelectorAll('[data-transfer-advance]').forEach(b=>b.onclick=()=>transferSend({type:'advance',id:+b.dataset.transferAdvance}));
  d.querySelectorAll('[data-transfer-retry]').forEach(b=>b.onclick=()=>transferSend({type:'retry',id:+b.dataset.transferRetry}));
  d.querySelectorAll('[data-transfer-remove]').forEach(b=>b.onclick=()=>{
    const id=+b.dataset.transferRemove,r=s.rows.find(r=>r.id===id);
    const deleting=s.removeFiles&&s.method==='copy';
    const actionLabel=deleting?(s.removeTorrent?t('Supprimer le torrent et ses fichiers source','Delete source torrent and files'):t('Supprimer les fichiers et garder le torrent en pause','Delete files and keep torrent paused')):t('Retirer le torrent sans supprimer les fichiers','Remove torrent without deleting files');
    d.innerHTML=`<h2>${t('Confirmer le nettoyage à la source','Confirm source cleanup')}</h2><p><strong>${escape(r.name)}</strong></p><p>${s.method==='shared'?t('Le seed est confirmé à destination. Les fichiers partagés restent en place et seul le torrent source sera retiré.','Destination seeding is confirmed. Shared files stay in place; only the source torrent will be removed.'):t('La copie est vérifiée et le seed confirmé à destination. La copie destination reste conservée.','The copy is verified and destination seeding confirmed. The destination copy is retained.')}</p><p class="muted">${t('Source','Source')} · ${escape(r.sourceClient)} · ${escape(r.sourcePath)}<br>${t('Destination','Destination')} · ${escape(s.destination)} · ${escape(destinationFolder(s,r))}</p><p>${escape(actionLabel)}</p>${deleting?`<p>${t('Les fichiers source de ce torrent seront supprimés définitivement.','This torrent’s source files will be permanently deleted.')}</p>`:''}<button id="transfer-keep">${t('Conserver la source','Keep the source')}</button> <button id="transfer-confirm-remove" class="primary">${escape(actionLabel)}</button>`;
    $('transfer-keep').onclick=drawTransfer;
    $('transfer-confirm-remove').onclick=()=>transferSend({type:'remove-source',id});
  });
}
const renderTorrents=render;
render=function(){renderTorrents();const launch=document.createElement('div');launch.className='toolbar transfer-entry';launch.innerHTML=`<button class="primary" id="open-transfer-preview">${t('Aperçu du transfert entre clients','Client-transfer preview')}</button><small>${t('Simulation · aucun fichier modifié','Simulation · no files changed')} · ${t(mode==='desktop'?'Application de bureau':'Interface Web',mode==='desktop'?'Desktop app':'WebUI')}</small>`;$('app').prepend(launch);$('open-transfer-preview').onclick=()=>transferPlan()};
render();
if(q.get('transfer')!=='closed')transferPlan();
</script></html>
