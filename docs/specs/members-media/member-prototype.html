dialog{border:1px solid #ffffff24;border-radius:14px;background:#162026;color:#f2f3ef;width:min(480px,92vw);padding:22px}dialog::backdrop{background:#000a}
dialog label{display:grid;gap:6px;margin:10px 0;font-size:13px}dialog input,dialog textarea{width:100%;box-sizing:border-box}
.media-row-wish{display:grid;place-items:center;text-align:center;border:1px dashed #ffffff33;border-radius:7px;aspect-ratio:2/3;color:#c9d3d6;font-size:13px;padding:10px}
#toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:#203d39;border:1px solid #79d3c5;color:#e6f6f2;border-radius:10px;padding:10px 16px;z-index:60;font-size:13px}
#switcher{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;background:#0d1216;color:#fff;border:1px solid #ffffff40;border-radius:999px;padding:6px 8px;box-shadow:0 10px 40px #0008;z-index:50;font-size:13px}
#switcher button,#switcher select{background:#ffffff14!important;border:1px solid #ffffff30;color:#fff;border-radius:999px;padding:4px 12px}#switcher b{min-width:150px;text-align:center}
</style>
<section id="view-media" class="view" data-layout="cinematic" data-kind="video"></section>
<dialog id="wish"></dialog><div id="toast" hidden></div>
<div id="switcher"><button id="prev" aria-label="Variante précédente">←</button><b id="label"></b><button id="next" aria-label="Variante suivante">→</button>
 <select id="answer" aria-label="Simuler la réponse"><option value="">Simuler la réponse de Vincent…</option><option value="accept">Vincent accepte</option><option value="refuse">Vincent refuse</option><option value="arrive">Le film arrive dans Médias</option></select><button id="caps">Quota atteint</button></div>
<script>
const OWNER="Vincent";
const RELEASE=["Dune.Part.Two.2024.MULTi.1080p.WEB.x264-TEAM",7.1,81,"green",880];
let caps={week:[3,5],size:[42,100],pending:[2,3]},capsFull=false;
let requests=[
 {id:1,title:"Oppenheimer",year:2023,state:"pending",at:"il y a 2 h",art:1},
 {id:2,title:"Vice-Versa 2",year:2024,state:"accepted",at:"hier",by:OWNER,art:2,progress:64},
 {id:3,title:"Saw X",year:2023,state:"refused",at:"il y a 3 j",by:OWNER,note:"Pas cette semaine",art:3},
];
let unread=1,dune=null,view="home",drawer=false;
const STATE={pending:["En attente","wait"],wish:["Vœu","wait"],accepted:["Acceptée",""],downloading:["En téléchargement",""],available:["Dans Médias",""],refused:["Refusée","no"]};
const variants=[["A","Rangée"],["B","Cloche"],["C","Onglet"]];
let variant=new URLSearchParams(location.search).get("variant")||"A";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
const art=(title,c="",badge="")=>`<div class="media-art missing-art ${c}">${badge}<span class="media-art-title">${esc(title)}</span></div>`;
const left=()=>({n:caps.week[1]-caps.week[0],go:caps.size[1]-caps.size[0],pend:caps.pending[1]-caps.pending[0]});
function quotaLine(){const l=left();if(capsFull||l.n<=0)return `<p class="quota full">Quota atteint : 5 demandes cette semaine. Prochaine possible lundi.</p>`;
 if(l.pend<=0)return `<p class="quota full">3 demandes déjà en attente : attendez la réponse de ${OWNER}.</p>`;
 return `<p class="quota">Il vous reste ${l.n} demande${l.n>1?"s":""} et ${l.go} Go cette semaine.</p>`}
const canAsk=()=>!capsFull&&left().n>0&&left().pend>0&&caps.size[0]+RELEASE[1]<=caps.size[1];

function topbar(){return `<div class="media-topbar"><div class="media-tabs" role="tablist"><button role="tab" aria-selected="true">Vidéo</button><button role="tab" aria-selected="false">Musique</button></div>
 <nav class="media-browse-nav"><button class="${view==="home"?"active":""}" data-view="home">Accueil</button><button>Films</button><button>Séries</button><button>Animés</button><button>Reprendre la lecture</button>${variant==="C"?`<button class="${view==="mine"?"active":""}" data-view="mine">Mes demandes${unread?` (${unread})`:""}</button>`:""}</nav>
 <input id="media-search" type="search" placeholder="Rechercher dans vos médias" aria-label="Rechercher">
 ${variant==="B"?`<button class="icon-button bell" data-bell aria-label="Mes demandes et notifications">🔔${unread?`<b>${unread}</b>`:""}</button>`:""}
 <button class="icon-button" aria-label="Mode Media Center">⤢</button></div>`}

/* The tracker film's panel: "Demander" for a Member, then the Request's state. */
function feature(){return `<section class="media-feature"><div class="media-feature-art media-art" style="background:linear-gradient(120deg,#3c5a6e,#162430)"></div>
 <div class="media-feature-copy has-poster">${art("Dune : Deuxième partie","media-feature-poster")}
 <p class="media-eyebrow">Sur le tracker</p><h2>Dune : Deuxième partie</h2><p class="media-feature-meta">2024 · 2:46:00 · Science-fiction · ★ 8.1</p>
 <p class="media-feature-description">Paul Atreides s'unit à Chani et aux Fremen pour mener la révolte contre ceux qui ont détruit sa famille.</p>
 <div class="media-tracker-release"><span class="media-score score-green">${RELEASE[2]}</span><span class="media-tracker-name">${RELEASE[0]}</span><span class="media-tracker-facts">${RELEASE[1]} Go · ${RELEASE[4]} sources · il y a 2 jours</span></div>
 ${dune?`<div class="request-state"><span class="media-poster-badge ${STATE[dune.state][1]}" style="position:static">${STATE[dune.state][0]}</span>${dune.state==="pending"?`Demandé à ${OWNER} ${dune.at}.`:dune.state==="refused"?`${OWNER} : « ${esc(dune.note)} »`:dune.state==="available"?"Prêt à regarder.":`Accepté par ${OWNER}, en téléchargement.`}</div>
   <div class="media-feature-actions" style="margin-top:12px">${dune.state==="pending"?`<button class="media-secondary" data-cancel>Annuler la demande</button>`:dune.state==="available"?`<button class="media-primary">Lire</button>`:""}</div>`
  :`${quotaLine()}<div class="media-feature-actions"><button class="media-primary" data-ask ${canAsk()?"":"disabled"}>Demander à ${OWNER}</button><button class="media-secondary" data-wish>Faire un vœu</button></div>`}
 </div></section>`}
function row(title,items,extra=""){return `<section class="media-home-row"><div class="media-home-row-header"><h2>${title}</h2><span class="media-home-row-count">${items.length} titres</span>${extra}</div><div class="media-row-track">${items.join("")}</div></section>`}
const card=(t,meta,c="",badge="")=>`<button class="media-row-card">${art(t,c,badge)}<strong>${esc(t)}</strong><span>${meta}</span></button>`;
const reqCard=r=>card(r.title,r.state==="refused"?`Refusée · ${esc(r.note||"")}`:r.state==="wish"?"Vœu · en attente":r.at,`c${r.art}`,`<span class="media-poster-badge ${STATE[r.state][1]}">${STATE[r.state][0]}${r.state==="downloading"||r.state==="accepted"?` · ${r.progress||3} %`:""}</span>`);
const libraryRows=()=>row("Récemment ajoutés",[card("Le Monde après nous","2023 · ★ 6.4"),card("Running Man","2025 · ★ 6.8","c1"),card("Sirāt","2025 · ★ 6.8","c2"),card("The Machine","2013 · ★ 5.9","c3")])
 +row("Disponible sur le tracker",[`<button class="media-row-card" data-dune>${art("Dune : Deuxième partie","",dune?`<span class="media-poster-badge ${STATE[dune.state][1]}">${STATE[dune.state][0]}</span>`:"")}<strong>Dune : Deuxième partie</strong><span>2024 · ★ 8.1</span></button>`,card("Le Garçon et le Héron","2023 · ★ 7.5","c1"),card("Anora","2024 · ★ 7.1","c2")],
  `<button class="quiet" data-wish style="margin-left:auto">Faire un vœu</button>`);

/* A · Rangée: "Mes demandes" is a home row, right after the library's newest. */
function A(){const mine=[...(dune?[dune]:[]),...requests];return topbar()+feature()+`<div class="media-shelves"><div class="media-home-rows">${libraryRows().replace("</section>",`</section>${row("Mes demandes",mine.map(reqCard),`<button class="quiet" data-wish style="margin-left:auto">Faire un vœu</button>`)}`)}</div></div>`}
/* B · Cloche: notices and Requests in a drawer opened from the menu. */
function B(){const mine=[...(dune?[dune]:[]),...requests];
 return topbar()+feature()+`<div class="media-shelves"><div class="media-home-rows">${libraryRows()}</div></div>`
 +(drawer?`<aside class="drawer"><div class="media-home-row-header"><h2>Mes demandes</h2><button class="quiet" data-close style="margin-left:auto">Fermer</button></div>${quotaLine()}
  ${mine.map(r=>`<div class="req ${r.unread?"unread":""}">${art(r.title,`c${r.art||0}`)}<div><strong>${esc(r.title)}</strong><small>${STATE[r.state][0]} · ${r.at}</small>${r.note?`<p class="note">${OWNER} : « ${esc(r.note)} »</p>`:""}${r.state==="pending"?`<button class="quiet" data-cancel-id="${r.id}" style="padding:4px 0">Annuler la demande</button>`:""}</div></div>`).join("")}
  <div class="media-feature-actions" style="margin-top:16px"><button class="media-secondary" data-wish>Faire un vœu</button></div></aside>`:"")}
/* C · Onglet: a "Mes demandes" page in the Media menu. */
function C(){if(view!=="mine")return topbar()+feature()+`<div class="media-shelves"><div class="media-home-rows">${libraryRows()}</div></div>`;
 const mine=[...(dune?[dune]:[]),...requests];
 return topbar()+`<div class="page"><p class="media-eyebrow">Vos demandes à ${OWNER}</p><h1>Mes demandes</h1>${quotaLine()}<div class="media-feature-actions" style="margin-bottom:18px"><button class="media-primary" data-wish>Faire un vœu</button></div>
  <div class="media-home-rows">${["pending","accepted","refused"].map(s=>{const items=mine.filter(r=>s==="accepted"?["accepted","downloading","available"].includes(r.state):s==="pending"?["pending","wish"].includes(r.state):r.state===s);return items.length?row({pending:"En attente",accepted:"Acceptées",refused:"Refusées"}[s],items.map(reqCard)):""}).join("")}</div></div>`}

function toast(t){const el=document.getElementById("toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,3500)}
function render(){document.getElementById("view-media").innerHTML=({A,B,C})[variant]();document.getElementById("label").textContent=`${variant} — ${variants.find(v=>v[0]===variant)[1]}`;document.getElementById("caps").textContent=capsFull?"Quota normal":"Quota atteint"}
function wishDialog(){const d=document.getElementById("wish");d.innerHTML=`<form method="dialog"><h2 style="margin:0 0 6px">Faire un vœu</h2><p style="color:#9da9ad;margin:0">Un film introuvable ? ${OWNER} cherchera la bonne release.</p>
 <label>Titre<input id="wish-title" placeholder="ex. le dernier Miyazaki"></label><label>Année (facultatif)<input inputmode="numeric" placeholder="2023"></label><label>Un mot pour ${OWNER}<textarea rows="3" placeholder="en VF si possible"></textarea></label>
 <div class="media-feature-actions"><button class="media-primary" value="send" data-send-wish>Envoyer le vœu</button><button class="media-secondary" value="cancel">Annuler</button></div></form>`;d.showModal()}
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t||t.closest("#switcher"))return;const d=t.dataset;
 if("ask" in d){dune={id:0,title:"Dune : Deuxième partie",year:2024,state:"pending",at:"à l'instant",art:0};caps.week[0]++;caps.pending[0]++;toast(`Demande envoyée à ${OWNER}`);render()}
 else if("cancel" in d){dune=null;caps.week[0]--;caps.pending[0]--;toast("Demande annulée");render()}
 else if(d.cancelId){requests=requests.filter(r=>r.id!==+d.cancelId);caps.pending[0]--;render()}
 else if("wish" in d){wishDialog()}
 else if("sendWish" in d){const title=document.getElementById("wish-title").value||"Le dernier Miyazaki";requests.unshift({id:Date.now(),title,state:"wish",at:"à l'instant",art:2});caps.pending[0]++;toast(`Vœu envoyé à ${OWNER}`);setTimeout(render,0)}
 else if("bell" in d){drawer=true;unread=0;render()}
 else if("close" in d){drawer=false;render()}
 else if(d.view){view=d.view;if(view==="mine")unread=0;render()}
});
document.getElementById("answer").onchange=e=>{const v=e.target.value;e.target.value="";if(!dune){toast("Demandez d'abord Dune");return}
 if(v==="accept"){dune.state="downloading";dune.progress=8;toast(`${OWNER} a accepté Dune : le téléchargement commence`)}
 if(v==="refuse"){dune.state="refused";dune.note="On l'a déjà en 4K sur l'autre disque";caps.pending[0]--;toast(`${OWNER} a refusé Dune`)}
 if(v==="arrive"){dune.state="available";toast("Dune est arrivé dans Médias")}
 dune.unread=true;unread++;render()};
document.getElementById("caps").onclick=()=>{capsFull=!capsFull;render()};
function go(n){const i=variants.findIndex(v=>v[0]===variant);variant=variants[(i+n+variants.length)%variants.length][0];view="home";drawer=false;const u=new URL(location);u.searchParams.set("variant",variant);history.replaceState(null,"",u);render()}
document.getElementById("prev").onclick=()=>go(-1);document.getElementById("next").onclick=()=>go(1);
document.addEventListener("keydown",e=>{if(e.target.closest("input,textarea,select,dialog"))return;if(e.key==="ArrowLeft")go(-1);if(e.key==="ArrowRight")go(1)});
if(!variants.some(v=>v[0]===variant))variant="A";render();
</script>
