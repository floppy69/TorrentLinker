  <nav class="nav"><span>Zen</span><span>Bibliothèque</span><span>Recherche</span><span>Torrents</span><span>Médias</span><span class="active">Demandes <span class="count" id="nav-count"></span></span><span>Paramètres</span></nav>
  <div class="sidebar-foot row"><div class="avatar">V</div><div><strong class="tiny">Vous</strong><div class="tiny muted">Propriétaire</div></div></div>
 </aside>
 <main class="main" id="app"></main>
</div>
<div id="switcher"><button id="prev" aria-label="Variante précédente">←</button><b id="label"></b><button id="next" aria-label="Variante suivante">→</button><button id="tight">Marge serrée</button><button id="theme">Thème</button></div>
<script>
const MEMBERS={lea:{name:"Léa",perms:"Médias, demandes",caps:{week:[3,5],size:[42,100],pending:[2,3]}},hugo:{name:"Hugo",perms:"Profil enfant · -10 ans",caps:{week:[1,2],size:[6,30],pending:[1,1]},limit:10},maman:{name:"Maman",perms:"Médias, demandes, approuve",caps:{week:[0,10],size:[0,200],pending:[0,5]}}};
const COVER=["#4d7392","#8c4646","#46805e","#86733a","#6b4c8c","#3a7f7f"];
const now=Date.now(),h=36e5;
let requests=[
 {id:1,kind:"request",member:"lea",title:"Dune : Deuxième partie",year:2024,rating:"-12",at:now-2*h,status:"pending",note:"",c:0,
  releases:[["Dune.Part.Two.2024.MULTi.2160p.WEB.x265-TEAM",19.8,88,"green",412],["Dune.Part.Two.2024.MULTi.1080p.WEB.x264-TEAM",7.1,81,"green",880],["Dune.Part.Two.2024.VFF.2160p.BluRay.REMUX-ZZ",71.4,74,"red",95]],chosen:0},
 {id:2,kind:"request",member:"hugo",title:"Oppenheimer",year:2023,rating:"-12",at:now-5*h,status:"pending",note:"Pour l'école !",c:1,
  releases:[["Oppenheimer.2023.MULTi.1080p.WEB.x264-TEAM",4.2,79,"yellow",230],["Oppenheimer.2023.MULTi.2160p.BluRay.x265-TEAM",38.0,71,"red",120]],chosen:0},
 {id:3,kind:"wish",member:"lea",title:"Le dernier Miyazaki, en VF",year:null,rating:"",at:now-26*h,status:"pending",note:"Celui avec le héron",c:2,releases:[],chosen:null,
  search:[["Le Garçon et le Héron",2023,[["The.Boy.and.the.Heron.2023.MULTi.1080p.BluRay.x264-TEAM",9.4,90,"green",310],["Le.Garcon.et.le.Heron.2023.VFF.2160p.WEB.x265-TT",16.2,84,"green",140]]]]},
 {id:4,kind:"request",member:"hugo",title:"Vice-Versa 2",year:2024,rating:"Tous publics",at:now-30*h,status:"downloading",progress:64,c:3,releases:[["Inside.Out.2.2024.MULTi.1080p.WEB.x264-TEAM",5.6,86,"green",640]],chosen:0,by:"Maman"},
 {id:5,kind:"request",member:"maman",title:"Anatomie d'une chute",year:2023,rating:"-12",at:now-50*h,status:"available",c:4,releases:[["Anatomie.d.une.chute.2023.FRENCH.1080p.BluRay.x264-TEAM",8.8,92,"green",210]],chosen:0,by:"Vous"},
 {id:6,kind:"request",member:"lea",title:"Saw X",year:2023,rating:"-16",at:now-80*h,status:"refused",reason:"Pas cette semaine",c:5,releases:[["Saw.X.2023.MULTi.1080p.WEB.x264-TEAM",5.0,77,"yellow",150]],chosen:0,by:"Vous"},
];
const STAGES={pending:["En attente","amber"],wish:["Vœu à résoudre","blue"],downloading:["En téléchargement","blue"],available:["Dans Médias","green"],refused:["Refusée",""]};
const variants=[["A","Liste et inspecteur"],["B","Affiches"],["C","Parcours"]];
const params=new URLSearchParams(location.search);
let variant=params.get("variant")||"A",selected=1,tab="pending",filter="all",drawer=null,account=params.get("margin")==="tight"?"tight":"roomy";
const ACCOUNTS={roomy:{upload:2188,download:244.2},tight:{upload:200,download:190}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
const ago=t=>{const x=(now-t)/h;return x<1?"à l'instant":x<24?`il y a ${Math.round(x)} h`:`il y a ${Math.round(x/24)} j`};
const stage=r=>r.status==="pending"&&r.kind==="wish"?"wish":r.status;
const rel=r=>r.chosen==null?null:r.releases[r.chosen];
const fmt=go=>go>=1000?`${(go/1000).toFixed(3).replace(".",",")} To`:`${go.toFixed(go<10?1:0).replace(".",",")} Go`;
const margin=()=>ACCOUNTS[account].upload/0.8-ACCOUNTS[account].download;
const inFlight=()=>requests.filter(r=>r.status==="downloading").reduce((s,r)=>s+rel(r)[1]*(1-r.progress/100),0);
const pendingSize=except=>requests.filter(r=>r.status==="pending"&&r!==except&&rel(r)).reduce((s,r)=>s+rel(r)[1],0);
const pendingCount=()=>requests.filter(r=>r.status==="pending").length;
const avatar=m=>`<span class="avatar" title="${MEMBERS[m].name}">${MEMBERS[m].name[0]}</span>`;
const cover=(r,cls="")=>`<div class="cover ${cls}" style="--c:${COVER[r.c]}"><span>${r.kind==="wish"?"?":esc(r.title)}</span></div>`;
const score=x=>x?`<span class="score ${x[3]}" title="ReleaseScore">${x[2]}</span>`:"";
const pill=r=>{const [text,colour]=STAGES[stage(r)];return `<span class="pill dot ${colour}">${text}${r.status==="downloading"?` · ${r.progress} %`:""}</span>`};
function warnings(r){const m=MEMBERS[r.member],w=[],x=rel(r);
 if(m.limit&&r.rating&&parseInt(r.rating.replace("-",""))>m.limit)w.push(`Classé ${r.rating}, au-dessus de la limite de ${m.name} (-${m.limit})`);
 if(x&&m.caps.size[0]+x[1]>m.caps.size[1])w.push(`Dépasse le quota de ${m.name} : ${m.caps.size[0]} + ${x[1]} Go sur ${m.caps.size[1]} cette semaine`);
 if(x&&margin()-inFlight()-x[1]<0)w.push("Dépasse votre marge : c411 bloquerait le téléchargement");
 return w}
/* The margin bar (decided on #127): an approved metric with a segmented track. */
function marginMetric(r,title){
 const total=margin(),flight=inFlight(),mine=r&&rel(r)?rel(r)[1]:0,others=pendingSize(r),after=total-flight-mine,over=after<0,left=r?after:after-others;
 const parts=[["flight",flight,"En cours","var(--muted)"],["this"+(over?" over":""),mine,"Cette demande","var(--accent)"],["others",others,r?"Autres demandes":"Demandes en attente","color-mix(in srgb,var(--accent) 40%,transparent)"]].filter(p=>p[1]>0&&(r||!p[0].startsWith("this")));
 const pct=v=>Math.max(0,Math.min(100,v/total*100));
 return `<div class="metric margin"><div class="row between"><small>${title||"Marge de téléchargement"}</small><small>upload ÷ 0,8 − download</small></div>
  <strong>${over?`<span class="danger">${fmt(-after)} de trop</span>`:fmt(Math.max(0,left))}</strong> <small style="display:inline">${over?"c411 bloquerait le téléchargement":`restants sur ${fmt(total)}`}</small>
  <div class="track">${parts.map(p=>`<i class="${p[0]}" style="width:${pct(p[1])}%;${p[0]==="this"?"background:var(--accent)":""}" title="${p[2]} ${fmt(p[1])}"></i>`).join("")}</div>
  <div class="legend">${parts.map(p=>`<span><span class="key" style="background:${p[0].includes("over")?"var(--danger)":p[3]}"></span>${p[2]} <b>${fmt(p[1])}</b></span>`).join("")}</div></div>`}
function quota(m){const c=MEMBERS[m].caps,metric=(v,max,label,unit="")=>`<div class="metric" style="flex:1;min-width:0"><strong>${v}${unit}</strong> <small style="display:inline">/ ${max}${unit}</small><small>${label}</small><div class="track"><i style="width:${Math.min(100,v/max*100)}%;${v>=max?"background:var(--danger)":""}"></i></div></div>`;
 return `<div class="metrics">${metric(c.week[0],c.week[1],"demandes cette semaine")}${metric(c.size[0],c.size[1],"cette semaine"," Go")}${metric(c.pending[0],c.pending[1],"en attente")}</div>`}
function decide(id,action,extra={}){const r=requests.find(x=>x.id===id);if(!r)return;const c=MEMBERS[r.member].caps;
 if(action==="approve"){if(r.chosen==null)return;r.status="downloading";r.progress=3;r.by="Vous";c.pending[0]=Math.max(0,c.pending[0]-1);c.size[0]=+(c.size[0]+rel(r)[1]).toFixed(1)}
 if(action==="refuse"){r.status="refused";r.reason=extra.reason||"";r.by="Vous";c.pending[0]=Math.max(0,c.pending[0]-1)}
 if(action==="choose")r.chosen=extra.index;
 if(action==="resolve"){const [title,year,rels]=r.search[extra.film];Object.assign(r,{title,year,releases:rels,chosen:0,kind:"request",rating:"Tous publics"})}
 render()}
function heading(text){return `<div class="top row between wrap" style="align-items:flex-end"><div class="heading"><div class="eyebrow">Partage</div><h1>Demandes</h1><p class="muted">${text}</p></div>
 <div style="width:min(520px,100%)">${marginMetric(null)}</div></div>`}

/* Everything about one request: the Community inspector's parts. */
function inspector(r){const x=rel(r),w=warnings(r),pend=r.status==="pending";
 return `<div class="row between"><span class="eyebrow">Demande de ${MEMBERS[r.member].name}</span>${pill(r)}</div>
 <div class="hero">${cover(r)}<div><h2>${esc(r.title)}</h2><div class="row wrap"><span class="pill">${r.year||"Année inconnue"}</span><span class="pill">${r.rating?`Classé ${r.rating}`:"Classement inconnu"}</span></div></div></div>
 ${w.map(t=>`<p class="pill amber" style="white-space:normal;margin-bottom:8px">${esc(t)}</p>`).join("")}
 ${r.kind==="wish"?`<label class="label">Trouver le film</label><div class="search"><input value="miyazaki heron"></div>
   <div class="stack" style="gap:8px;margin:12px 0 17px">${r.search.map((s,i)=>`<div class="row between"><div><strong>${s[0]}</strong> <span class="muted tiny">${s[1]} · ${s[2].length} releases</span></div><button class="small" data-resolve="${r.id}:${i}">C'est celui-ci</button></div>`).join("")}</div>`
 :`<label class="label">Release</label><div class="segment">${r.releases.map((y,i)=>`<button class="${i===r.chosen?"selected":""}" ${pend?`data-choose="${r.id}:${i}"`:"disabled"}>${score(y)} ${fmt(y[1])}</button>`).join("")}</div>
   ${x?`<p class="help release">${esc(x[0])} · ${x[4]} sources</p>`:""}`}
 ${pend&&x?`<div style="margin:12px 0 17px">${marginMetric(r,"Ce que prendrait ce téléchargement")}</div>`:""}
 <label class="label">Quotas de ${MEMBERS[r.member].name}</label>${quota(r.member)}
 <div class="timeline"><div class="event"><small>${ago(r.at)}</small>${MEMBERS[r.member].name} a ${r.kind==="wish"?"fait un vœu":"demandé ce film"}${r.note?`<p>« ${esc(r.note)} »</p>`:""}</div>
 ${r.status!=="pending"?`<div class="event"><small>${r.by}</small>${r.status==="refused"?`Refusée${r.reason?`<p>« ${esc(r.reason)} »</p>`:""}`:`Acceptée et envoyée au client${r.status==="available"?"<p>Arrivée dans Médias, "+MEMBERS[r.member].name+" a été prévenu·e</p>":""}`}</div>`:""}</div>
 ${pend?`<label class="label">Un mot pour ${MEMBERS[r.member].name}</label><textarea id="reason" style="min-height:70px" placeholder="Facultatif"></textarea>
  <div class="detail-actions" style="margin-top:12px"><button class="primary" data-approve="${r.id}" ${x?"":"disabled"}>Accepter</button><button data-refuse="${r.id}">Refuser</button></div>`:""}`}

/* A · Liste et inspecteur: Community's library list beside its inspector. */
function A(){const list=requests.filter(r=>(tab==="pending")===(r.status==="pending")).filter(r=>filter==="all"||r.member===filter);
 const r=requests.find(x=>x.id===selected&&list.includes(x))||list[0];
 return `${heading("Ce que les membres demandent. Rien ne se télécharge sans votre accord.")}
 <div class="row between wrap workbar"><div class="tabs"><button class="${tab==="pending"?"selected":""}" data-tab="pending">À traiter <span class="count">${pendingCount()}</span></button><button class="${tab==="done"?"selected":""}" data-tab="done">Historique <span class="count">${requests.length-pendingCount()}</span></button></div></div>
 <div class="workspace"><section class="panel library"><div class="tools"><div class="search"><input placeholder="Rechercher un titre ou un membre"></div>
  <div class="filters"><button class="${filter==="all"?"selected":""}" data-filter="all">Tous</button>${Object.keys(MEMBERS).map(m=>`<button class="${filter===m?"selected":""}" data-filter="${m}">${MEMBERS[m].name}</button>`).join("")}</div></div>
  <div class="table-head"><span>Demande</span><span>Release</span><span>État</span></div>
  ${list.map(x=>`<button class="torrent ${r&&x.id===r.id?"chosen":""}" data-select="${x.id}"><span class="identity">${cover(x)}<span style="min-width:0"><strong>${esc(x.title)}</strong><span class="meta row">${avatar(x.member)} ${MEMBERS[x.member].name} · ${ago(x.at)}${warnings(x).length?` <span class="pill amber">${warnings(x).length} alerte${warnings(x).length>1?"s":""}</span>`:""}</span></span></span>
   <span class="meta">${rel(x)?`${score(rel(x))} ${fmt(rel(x)[1])}`:"À choisir"}</span><span>${pill(x)}</span></button>`).join("")||`<div class="empty">Rien à traiter.</div>`}
  <div class="library-foot"><span>${list.length} demande${list.length>1?"s":""}</span><span>Les membres sont prévenus de chaque décision</span></div></section>
 <aside class="panel inspector">${r?inspector(r):`<div class="empty">Choisissez une demande.</div>`}</aside></div>`}

/* B · Affiches: Community's gallery tiles; the details open in its drawer. */
function B(){const tile=r=>{const x=rel(r),w=warnings(r);return `<div class="panel tile">${cover(r)}<div class="tile-body">
  <div class="row between"><strong>${esc(r.title)}</strong>${avatar(r.member)}</div><span class="muted tiny">${r.year||"Vœu"} · ${MEMBERS[r.member].name} · ${ago(r.at)}</span>
  <div class="row">${pill(r)}${x?`${score(x)}<span class="pill">${fmt(x[1])}</span>`:""}${w.length?`<span class="pill amber">${w.length} alerte${w.length>1?"s":""}</span>`:""}</div>
  ${r.status==="pending"?`<div class="detail-actions" style="margin-top:12px">${x?`<button class="primary small" data-approve="${r.id}">Accepter</button><button class="small" data-refuse="${r.id}">Refuser</button>`:""}<button class="small" data-open="${r.id}">${x?"Détails":"Trouver la release"}</button></div>`:""}</div></div>`};
 const pend=requests.filter(r=>r.status==="pending"),done=requests.filter(r=>r.status!=="pending");
 return `${heading(`${pend.length} demande${pend.length>1?"s":""} à traiter, en affiches comme dans Médias.`)}
 <section class="panel library"><div class="tools row between"><h2>À traiter <span class="count">${pend.length}</span></h2><button data-approve-all ${pend.some(r=>rel(r)&&!warnings(r).length)?"":"disabled"}>Tout accepter sans alerte</button></div><div class="gallery">${pend.map(tile).join("")}</div></section>
 <section class="panel library" style="margin-top:18px"><div class="tools"><h2>Récemment traitées</h2></div><div class="gallery">${done.map(tile).join("")}</div></section>
 ${drawer?`<div class="veil" data-close></div><aside class="drawer">${inspector(requests.find(x=>x.id===drawer))}<button style="margin-top:14px" data-close>Fermer</button></aside>`:""}`}

/* C · Parcours: Community's queue board, from asked to watched. */
function C(){const cols=["pending","wish","downloading","available","refused"];
 return `${heading("Chaque demande, de la question jusqu'à Médias.")}
 <div class="row wrap" style="gap:12px;margin-bottom:21px;align-items:stretch">${Object.keys(MEMBERS).map(m=>`<div class="panel" style="padding:14px 16px;flex:1;min-width:260px"><div class="row" style="margin-bottom:10px">${avatar(m)}<div><strong>${MEMBERS[m].name}</strong><div class="tiny muted">${MEMBERS[m].perms}</div></div></div>${quota(m)}</div>`).join("")}</div>
 <div class="queue-grid" style="grid-template-columns:repeat(5,minmax(210px,1fr));overflow-x:auto">${cols.map(c=>{const items=requests.filter(r=>stage(r)===c);return `<div class="queue-col"><h3>${STAGES[c][0]}<span class="count">${items.length}</span></h3>
  ${items.map(r=>{const x=rel(r),w=warnings(r);return `<div class="queue-card"><div class="row">${avatar(r.member)}<span class="tiny muted">${MEMBERS[r.member].name} · ${ago(r.at)}</span></div>
   <h3>${esc(r.title)}</h3>${x?`<div class="row" style="margin-top:8px">${score(x)}<span class="pill">${fmt(x[1])}</span></div>`:`<p>« ${esc(r.note)} »</p>`}
   ${w.map(t=>`<p class="pill amber" style="white-space:normal;margin-top:8px">${esc(t)}</p>`).join("")}
   ${r.status==="downloading"?`<div class="metric" style="margin-top:10px"><small>${r.progress} % · accepté par ${r.by}</small><div class="track"><i style="width:${r.progress}%"></i></div></div>`:""}
   ${r.status==="available"?`<time>Prêt dans Médias</time>`:""}${r.status==="refused"&&r.reason?`<p>« ${esc(r.reason)} »</p>`:""}
   ${c==="pending"?`<div class="detail-actions" style="margin-top:12px"><button class="primary small" data-approve="${r.id}">Accepter</button><button class="small" data-refuse="${r.id}">Refuser</button></div>`:""}
   ${c==="wish"?`<button class="small" style="margin-top:12px" data-open="${r.id}">Trouver la release</button>`:""}</div>`}).join("")||`<p class="tiny muted">Vide</p>`}</div>`}).join("")}</div>
 ${drawer?`<div class="veil" data-close></div><aside class="drawer">${inspector(requests.find(x=>x.id===drawer))}<button style="margin-top:14px" data-close>Fermer</button></aside>`:""}`}

function render(){
 document.getElementById("app").innerHTML=({A,B,C})[variant]();
 document.getElementById("nav-count").textContent=pendingCount()||"";
 document.getElementById("label").textContent=`${variant} — ${variants.find(v=>v[0]===variant)[1]}`;
 document.getElementById("tight").textContent=account==="tight"?"Marge large":"Marge serrée";
}
document.addEventListener("click",e=>{const t=e.target.closest("[data-select],[data-tab],[data-filter],[data-approve],[data-refuse],[data-choose],[data-resolve],[data-open],[data-close],[data-approve-all]");if(!t)return;const d=t.dataset;
 if(d.select){selected=+d.select;render()}
 else if(d.tab){tab=d.tab;render()}
 else if(d.filter){filter=d.filter;render()}
 else if(d.approve){drawer=null;decide(+d.approve,"approve")}
 else if(d.refuse){const reason=document.getElementById("reason")?.value||"";drawer=null;decide(+d.refuse,"refuse",{reason})}
 else if(d.choose){const [id,i]=d.choose.split(":");decide(+id,"choose",{index:+i})}
 else if(d.resolve){const [id,i]=d.resolve.split(":");decide(+id,"resolve",{film:+i})}
 else if(d.open){drawer=+d.open;render()}
 else if("close" in d){drawer=null;render()}
 else if("approveAll" in d){requests.filter(r=>r.status==="pending"&&rel(r)&&!warnings(r).length).forEach(r=>decide(r.id,"approve"))}
});
function setParam(k,v){const u=new URL(location);u.searchParams.set(k,v);history.replaceState(null,"",u)}
function go(step){const i=variants.findIndex(v=>v[0]===variant);variant=variants[(i+step+variants.length)%variants.length][0];drawer=null;setParam("variant",variant);render()}
document.getElementById("prev").onclick=()=>go(-1);document.getElementById("next").onclick=()=>go(1);
document.getElementById("tight").onclick=()=>{account=account==="tight"?"roomy":"tight";setParam("margin",account);render()};
document.getElementById("theme").onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==="light"?"dark":"light"};
document.addEventListener("keydown",e=>{if(e.target.closest("input,textarea,[contenteditable]"))return;if(e.key==="ArrowLeft")go(-1);if(e.key==="ArrowRight")go(1);if(e.key==="Escape"&&drawer){drawer=null;render()}});
if(!variants.some(v=>v[0]===variant))variant="A";render();
</script>
