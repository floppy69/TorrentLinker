.triage{display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px;align-items:start;max-width:900px}.triage .media-art{width:220px}
.triage h2{font-size:24px;margin:0 0 6px}.triage p.desc{color:#c9d3d6;line-height:1.5}html[data-theme="light"] .triage p.desc{color:#3e5b5d}
.progress{height:4px;border-radius:2px;background:#ffffff1a;margin:0 0 22px;max-width:900px}.progress span{display:block;height:100%;border-radius:2px;background:#80d6c5}
.empty-ok{color:#80d6c5}
html[data-theme="light"] .page .suggest,html[data-theme="light"] .page .rating.none{color:#8a5a00}html[data-theme="light"] .page .rating-line,html[data-theme="light"] .page .media-feature-meta,html[data-theme="light"] .unrated small{color:#3e5b5d}html[data-theme="light"] .progress{background:#c4d4cc}html[data-theme="light"] .page .empty-ok{color:#146254}
@media (max-width:720px){.page{padding:18px 16px 110px}.triage{grid-template-columns:1fr}.triage .media-art{width:160px}.unrated{grid-template-columns:54px minmax(0,1fr)}.unrated>div:last-child{grid-column:1/-1}}
#toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:#203d39;border:1px solid #79d3c5;color:#e6f6f2;border-radius:10px;padding:10px 16px;z-index:60;font-size:13px}
#switcher{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;background:#0d1216;color:#fff;border:1px solid #ffffff40;border-radius:999px;padding:6px 8px;box-shadow:0 10px 40px #0008;z-index:50;font-size:13px;max-width:calc(100vw - 32px);flex-wrap:wrap;justify-content:center}
#switcher button,#switcher select{background:#ffffff14!important;border:1px solid #ffffff30;color:#fff!important;border-radius:999px;padding:4px 12px}#switcher b{min-width:130px;text-align:center}
</style>
<section id="view-media" class="view" data-layout="cinematic" data-kind="video"></section>
<div id="toast" hidden></div>
<div id="switcher"><button id="prev" aria-label="Variante précédente">←</button><b id="label"></b><button id="next" aria-label="Variante suivante">→</button>
 <select id="who" aria-label="Vu par"><option value="owner">Vu par Vincent (propriétaire)</option><option value="lea">Vu par Léa (membre, limite −12)</option></select><button id="theme">Thème</button></div>
<script>
/* The French CNC scale; every source is mapped to it. */
const SCALE=[["TP","Tous publics"],["10","−10"],["12","−12"],["16","−16"],["18","−18"]];
const short=r=>r==="TP"?"TP":"−"+r;
const SOURCE={nfo:"fichier NFO",tmdb:"TMDb (France)",owner:"Vincent"};
/* rating: null while unrated. suggest: a foreign rating from TMDb, mapped, waiting for confirmation. */
let films=[
 {id:1,title:"Vice-Versa 2",year:2024,genre:"Animation",time:"1:36:00",score:7.6,rating:"TP",source:"nfo",art:2,desc:"Riley entre dans l'adolescence et de nouvelles émotions s'installent au Quartier Général."},
 {id:2,title:"Oppenheimer",year:2023,genre:"Drame",time:"3:00:00",score:8.1,rating:"12",source:"tmdb",art:1,desc:"Le physicien J. Robert Oppenheimer dirige le projet Manhattan."},
 {id:3,title:"Le Monde après nous",year:2023,genre:"Thriller",time:"2:21:00",score:6.4,rating:null,suggest:["R","États-Unis","16"],art:4,desc:"Des vacances tournent court quand une cyberattaque coupe le pays du monde."},
 {id:4,title:"Saw X",year:2023,genre:"Horreur",time:"1:58:00",score:6.6,rating:"16",source:"tmdb",art:3,desc:"John Kramer part au Mexique pour un traitement expérimental."},
 {id:5,title:"Running Man",year:2025,genre:"Action",time:"2:13:00",score:6.8,rating:null,art:1,desc:"Un homme accepte de participer à un jeu télévisé mortel."},
 {id:6,title:"Le Garçon et le Héron",year:2023,genre:"Animation",time:"2:04:00",score:7.5,rating:"TP",source:"nfo",art:2,desc:"Mahito, endeuillé, suit un héron vers un monde fantastique."},
 {id:7,title:"Sirāt",year:2025,genre:"Drame",time:"1:55:00",score:6.8,rating:null,suggest:["FSK 16","Allemagne","16"],art:3,desc:"Un père cherche sa fille dans les rave parties du désert marocain."},
 {id:8,title:"The Machine",year:2013,genre:"Science-fiction",time:"1:31:00",score:5.9,rating:null,art:4,desc:"Deux chercheurs créent la première intelligence artificielle consciente."},
];
const variants=[["A","Liste"],["B","Rangée"],["C","Tri rapide"]];
let variant=new URLSearchParams(location.search).get("variant")||"A",who="owner",view="home",selected=3,editing=false,triage=0;
const LIMIT="12";
/* Each layout opens on its own screen, so the switcher shows the difference at once. */
const START={A:"list",B:"home",C:"triage"};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
const rank=r=>SCALE.findIndex(s=>s[0]===r);
const visible=f=>who==="owner"||(f.rating!==null&&rank(f.rating)<=rank(LIMIT));
const unrated=()=>films.filter(f=>f.rating===null);
const byId=id=>films.find(f=>f.id===id);
const art=(f,c="",badge="")=>`<div class="media-art missing-art c${f.art} ${c}">${badge}<span class="media-art-title">${esc(f.title)}</span></div>`;
const badge=f=>who==="owner"&&f.rating===null?`<span class="media-poster-badge none">Sans classification</span>`:"";

function topbar(){const n=unrated().length,own=who==="owner";
 const extra=own&&variant==="A"?`<button class="${view==="list"?"active":""}" data-view="list">Sans classification${n?` (${n})`:""}</button>`
  :own&&variant==="C"?`<button class="${view==="triage"?"active":""}" data-view="triage">Classer${n?` (${n})`:""}</button>`:"";
 return `<div class="media-topbar"><div class="media-tabs" role="tablist"><button role="tab" aria-selected="true">Vidéo</button><button role="tab" aria-selected="false">Musique</button></div>
 <nav class="media-browse-nav"><button class="${view==="home"?"active":""}" data-view="home">Accueil</button><button>Films</button><button>Séries</button><button>Reprendre la lecture</button>${extra}</nav>
 <input id="media-search" type="search" placeholder="Rechercher dans vos médias" aria-label="Rechercher"><button class="icon-button" aria-label="Mode Media Center">⤢</button></div>`}

/* The scale as buttons; the current value pressed. Shared by the title panel, the list and the triage. */
const picker=(f,keys=false)=>`<div class="rating-pick" role="group" aria-label="Classification de ${esc(f.title)}">${SCALE.map(([v,l],i)=>`<button class="media-secondary" data-rate="${f.id}" data-value="${v}" aria-pressed="${f.rating===v}">${l}${keys?`<kbd>${i+1}</kbd>`:""}</button>`).join("")}</div>`;
const suggestion=f=>f.suggest&&f.rating===null?`<p class="suggest">TMDb : ${esc(f.suggest[0])} (${f.suggest[1]}) → ${short(f.suggest[2])} ?<button class="media-secondary" data-rate="${f.id}" data-value="${f.suggest[2]}">Confirmer ${short(f.suggest[2])}</button></p>`:"";

/* The title panel: the rating next to the facts, its source, and editing for whoever may edit. */
function feature(){let f=byId(selected);if(!visible(f))f=films.find(visible);selected=f.id;
 const r=f.rating?`<span class="rating" title="${SOURCE[f.source]}">${short(f.rating)}</span>`:who==="owner"?`<span class="rating none">?</span>`:"";
 const line=who!=="owner"?"":f.rating?`<p class="rating-line">Classification ${SCALE[rank(f.rating)][1]} · ${SOURCE[f.source]} <button class="quiet" data-edit style="padding:2px 6px">${editing?"Fermer":"Modifier"}</button></p>`
  :`<p class="rating-line">Sans classification : masqué pour les profils limités.</p>${suggestion(f)}`;
 return `<section class="media-feature"><div class="media-feature-art media-art c${f.art}"></div>
 <div class="media-feature-copy has-poster">${art(f,"media-feature-poster")}
 <p class="media-eyebrow">Dans votre bibliothèque</p><h2>${esc(f.title)}</h2><p class="media-feature-meta">${r} ${f.year} · ${f.time} · ${f.genre} · ★ ${f.score}</p>
 <p class="media-feature-description">${esc(f.desc)}</p>${line}${who==="owner"&&(editing||f.rating===null)?picker(f):""}
 <div class="media-feature-actions" style="margin-top:14px"><button class="media-primary">Lire</button></div></div></section>`}
function row(title,items,extra=""){return `<section class="media-home-row"><div class="media-home-row-header"><h2>${title}</h2><span class="media-home-row-count">${items.length} titres</span>${extra}</div><div class="media-row-track">${items.join("")}</div></section>`}
const card=f=>`<button class="media-row-card" data-pick="${f.id}">${art(f,"",badge(f))}<strong>${esc(f.title)}</strong><span>${f.rating?short(f.rating)+" · ":""}${f.year} · ★ ${f.score}</span></button>`;
function home(extraRow=""){const lib=films.filter(visible);
 return topbar()+feature()+`<div class="media-shelves"><div class="media-home-rows">${extraRow}${row("Récemment ajoutés",lib.map(card))}${row("Animation",lib.filter(f=>f.genre==="Animation").map(card))}</div></div>`
  +(who==="lea"?`<p class="page lead" style="padding-top:0">Léa ne voit ni les films au-dessus de −12, ni ceux sans classification.</p>`:"")}

/* A · Liste: a "Sans classification" page in the Media menu, every unrated film with its suggestion. */
function A(){if(view!=="list"||who!=="owner")return home();const list=unrated(),sug=list.filter(f=>f.suggest);
 return topbar()+`<div class="page"><p class="media-eyebrow">Classifications</p><h1>Sans classification</h1>
 <p class="lead">Ces films sont masqués pour les profils limités tant qu'ils n'ont pas de classification. Les classifications françaises de TMDb et des fichiers NFO s'appliquent seules ; une classification étrangère attend votre confirmation.</p>
 ${sug.length?`<div class="media-feature-actions" style="margin-bottom:12px"><button class="media-primary" data-confirm-all>Confirmer les ${sug.length} suggestions</button></div>`:""}
 ${list.length?list.map(f=>`<div class="unrated">${art(f)}<div><strong>${esc(f.title)}</strong><small>${f.year} · ${f.genre}</small>${suggestion(f)||`<small>Aucune classification trouvée.</small>`}</div><div>${picker(f)}</div></div>`).join("")
  :`<p class="empty-ok">Tous les films ont une classification.</p>`}</div>`}

/* B · Rangée: an Owner-only home row, first, until nothing is left; a film opens in the title panel. */
function B(){const list=unrated();return home(who==="owner"&&list.length?row("Sans classification",list.map(card),`<span class="media-home-row-count" style="margin-left:auto">masqués pour les profils limités</span>`):"")}

/* C · Tri rapide: one film at a time, keys 1 to 5, the suggestion on Enter. */
function C(){if(view!=="triage"||who!=="owner")return home();const list=unrated();
 const done=films.length-list.length;
 if(!list.length)return topbar()+`<div class="page"><h1>Classer</h1><p class="empty-ok">Tous les films ont une classification.</p><div class="media-feature-actions"><button class="media-primary" data-view="home">Retour à l'accueil</button></div></div>`;
 const f=list[triage%list.length];
 return topbar()+`<div class="page"><p class="media-eyebrow">Classer · ${list.length} restant${list.length>1?"s":""}</p><div class="progress"><span style="width:${done/films.length*100}%"></span></div>
 <div class="triage">${art(f)}<div><h2>${esc(f.title)}</h2><p class="media-feature-meta">${f.year} · ${f.time} · ${f.genre} · ★ ${f.score}</p><p class="desc">${esc(f.desc)}</p>
 ${suggestion(f)||`<p class="rating-line">Aucune classification trouvée.</p>`}${picker(f,true)}
 <div class="media-feature-actions" style="margin-top:16px"><button class="media-secondary" data-skip>Passer</button></div>
 <p class="rating-line">Touches 1 à 5 pour classer${f.suggest?", Entrée pour confirmer la suggestion":""}, S pour passer.</p></div></div></div>`}

function toast(t){const el=document.getElementById("toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,3000)}
function render(){document.getElementById("view-media").innerHTML=({A,B,C})[variant]();document.getElementById("label").textContent=`${variant} — ${variants.find(v=>v[0]===variant)[1]}`}
function rate(id,value){const f=byId(id);f.rating=value;f.source="owner";editing=false;toast(`${f.title} : ${SCALE[rank(value)][1]}`);render()}
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t||t.closest("#switcher"))return;const d=t.dataset;
 if(d.rate)rate(+d.rate,d.value);
 else if(d.pick){selected=+d.pick;editing=false;render();scrollTo({top:0,behavior:"smooth"})}
 else if("edit" in d){editing=!editing;render()}
 else if("confirmAll" in d){const n=unrated().filter(f=>f.suggest);n.forEach(f=>{f.rating=f.suggest[2];f.source="owner"});toast(`${n.length} classifications confirmées`);render()}
 else if("skip" in d){triage++;render()}
 else if(d.view){view=d.view;render()}});
function go(n){const i=variants.findIndex(v=>v[0]===variant);variant=variants[(i+n+variants.length)%variants.length][0];view=START[variant];editing=false;const u=new URL(location);u.searchParams.set("variant",variant);history.replaceState(null,"",u);render()}
document.getElementById("prev").onclick=()=>go(-1);document.getElementById("next").onclick=()=>go(1);
document.getElementById("who").onchange=e=>{who=e.target.value;view=who==="owner"?START[variant]:"home";editing=false;render()};
document.getElementById("theme").onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==="light"?"dark":"light"};
document.addEventListener("keydown",e=>{if(e.target.closest("input,textarea,select,dialog"))return;
 if(variant==="C"&&view==="triage"){const list=unrated();if(list.length){const f=list[triage%list.length];
  if(e.key>="1"&&e.key<="5"){rate(f.id,SCALE[+e.key-1][0]);return}
  if(e.key==="Enter"&&f.suggest){rate(f.id,f.suggest[2]);return}
  if(e.key.toLowerCase()==="s"){triage++;render();return}}}
 if(e.key==="ArrowLeft")go(-1);if(e.key==="ArrowRight")go(1)});
if(!variants.some(v=>v[0]===variant))variant="A";view=START[variant];render();
</script>
