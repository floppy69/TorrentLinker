[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "torrentlinker"
version = "1.0.0-beta.28"
description = "Reconcile local files with private-tracker torrents and reseed them in qBittorrent, Deluge or Transmission"
requires-python = ">=3.11"
dependencies = [
  "packaging>=24",  # validate installed stable and prerelease package metadata
  "qbittorrent-api>=2026.10",
  "httpx[socks]>=0.27",
  "requests[socks]",  # SOCKS proxies for qBittorrent's adapter
  "guessit>=3.8",
  "torf>=4.2",
  "keyring>=24",
  "pillow>=10",  # CPU model renders and private image validation on headless servers
  "numpy>=1.26",  # the 3D preview reads and decimates meshes
  "pymediainfo>=6.1",  # MediaInfo of videos, for the Films & Vidéos upload (ADR-0012)
  "mutagen>=1.47",  # audio tags for the Audio and Ebook uploads
  "tzdata>=2024.1",  # IANA timezones for Assistant schedules, including Windows
]

[project.optional-dependencies]
desktop = ["PySide6>=6.6", "torrentlinker[web]"]
web = ["mcp>=2.3,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "cryptography>=43", "markdown-it-py>=3,<5"]
dev = ["torrentlinker[desktop,web]", "pytest>=8", "pytest-qt>=4.4", "ruff>=0.5", "mypy>=1.10"]
browser-test = ["playwright>=1.50"]
package = ["torrentlinker[desktop]", "pyinstaller>=6.10", "pillow>=10"]  # pillow converts the icon on Windows and macOS

[project.gui-scripts]
torrentlinker = "torrentlinker.cli:main"

[project.scripts]
torrentlinker-mcp = "torrentlinker.agent.stdio:main"
torrentlinker-web = "torrentlinker.web.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
torrentlinker = ["i18n/*.qm", "assets/*.png", "gui/*.qml", "web/static/*", "companion_extension/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # Qt signatures default to QModelIndex()

[tool.mypy]
python_version = "3.11"
packages = ["torrentlinker"]
mypy_path = "src"
ignore_missing_imports = true

[tool.setuptools.data-files]
"share/torrentlinker/docs" = ["docs/README.md"]
"share/torrentlinker/docs/guide/fr" = ["docs/guide/fr/*.md"]
"share/torrentlinker/docs/guide/en" = ["docs/guide/en/*.md"]
"share/torrentlinker/docs/guide/images" = ["docs/guide/images/*.png"]
"share/torrentlinker/docs/guide/images/en" = ["docs/guide/images/en/*.png"]
"share/torrentlinker/docs/guide/images/web" = ["docs/guide/images/web/*.png"]
